[build]
  publish = "."
  command = ""

# HTML must always be revalidated, or Safari will happily serve a week-old
# index.html after a deploy. Fingerprinted assets can cache hard.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
