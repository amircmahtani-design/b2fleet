<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B2Fleet — marketplace and content studio prototype</title>
<meta name="description" content="Clickable prototype of the B2Fleet B2B car rental marketplace and its admin content studio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpath d=%27M22 19V81%27 stroke=%27%231F6BFF%27 stroke-width=%2718%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
/* ============ TOKENS ============ */
:root{
  --navy:#0B2545; --navy-2:#123A63; --blue:#1F6BFF; --blue-d:#1557D6;
  --ink:#0B2545; --muted:#5C7191; --line:#E2E9F2; --surface:#F4F7FC;
  --card:#FFFFFF; --amber-bg:#FFF7E6; --amber:#9A6A0B;
  --green-bg:#E9F7EF; --green:#12784A; --radius:12px;
  --shadow-sm:0 1px 2px rgba(11,37,69,.06),0 1px 3px rgba(11,37,69,.05);
  --shadow-md:0 4px 16px rgba(11,37,69,.08);
  --shadow-lg:0 18px 50px rgba(11,37,69,.16);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;max-width:100%;overflow-x:clip}
body{font-family:var(--font);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
img{display:block;max-width:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;font-weight:800;line-height:1.1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LOGO ============ */
.logo-full,.logo-mark{display:block;object-fit:contain}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;
  padding:10px 18px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:.15s}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn-dark{background:var(--navy);color:#fff}
.btn-outline-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn-outline-w:hover{background:rgba(255,255,255,.1)}
.btn-lg{padding:14px 24px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ============ PUBLIC HEADER ============ */
.site-head{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:40}
.site-head>.wrap{display:flex;align-items:center;gap:26px;height:64px}
.site-nav{display:flex;gap:22px;font-weight:600;font-size:14.5px;color:var(--ink)}
.site-nav a{padding:21px 0;border-bottom:2px solid transparent;transition:.14s}
.site-nav a:hover{color:var(--blue)}
.site-nav a.on{color:var(--blue);border-bottom-color:var(--blue)}
.brand-link{display:flex;align-items:center;flex:none}
.head-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
.pill-sel{display:flex;align-items:center;gap:5px;color:var(--muted)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.mobile-nav{border-top:1px solid var(--line);background:#fff;padding:8px 0 16px;box-shadow:var(--shadow-md)}
.mobile-nav .wrap{display:grid;gap:2px;height:auto;max-height:calc(100dvh - 140px);overflow-y:auto}
.mobile-nav a:not(.btn){padding:12px 4px;font-weight:700;font-size:15.5px;border-bottom:1px solid #F2F6FA}
.mobile-nav a.on{color:var(--blue)}
.mobile-sel{display:flex;gap:10px;padding:12px 4px 14px;color:var(--muted);font-weight:600;font-size:14px}
.mobile-sel span{border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.mobile-nav .btn{width:100%;margin-top:7px}

/* ============ HERO ============ */
/* Image band and search card are separate layers: the card overlaps the
   bottom of the photograph so the vehicle stays visible above it. */
.hero{position:relative;background:var(--navy);color:#fff}
.hero-band{position:relative;height:clamp(400px,40vw,520px);overflow:hidden}
.hero-band>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:var(--fx,50%) var(--fy,50%)}
.hero-scrim{position:absolute;inset:0;background:
  linear-gradient(96deg,rgba(11,37,69,.95) 0%,rgba(11,37,69,.86) 30%,rgba(11,37,69,.42) 54%,rgba(11,37,69,.02) 72%),
  linear-gradient(to top,rgba(11,37,69,.55) 0%,transparent 34%)}
.hero-copy{position:relative;padding-top:clamp(38px,5.4vw,74px)}
.hero h1{font-size:clamp(31px,4.4vw,52px);line-height:1.07;white-space:pre-line;letter-spacing:-.035em;
  text-shadow:0 2px 24px rgba(11,37,69,.35)}
.hero p.sub{margin:20px 0 0;max-width:370px;color:#D2DFEF;font-size:16px;line-height:1.55}
.hero-tools{position:relative;z-index:3;margin-top:clamp(-104px,-8vw,-76px)}

/* search panel */
.search-card{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;color:var(--ink)}
.search-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.search-tabs::-webkit-scrollbar{display:none}
.search-tab{flex:none;display:flex;align-items:center;gap:8px;padding:15px 22px;font-weight:600;font-size:14.5px;
  color:var(--muted);background:none;border:0;border-bottom:2px solid transparent}
.search-tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.search-body{display:grid;grid-template-columns:1.5fr 1fr 1fr auto 1fr auto;align-items:stretch;padding:8px}
.sf{padding:9px 14px;border-right:1px solid var(--line);min-width:0}
.sf:last-of-type{border-right:0}
.sf label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.sf .val{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-check{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13.5px;font-weight:600;border-right:1px solid var(--line)}
.sf-check i{width:16px;height:16px;border:1.5px solid #B9C6D8;border-radius:4px;display:block;flex:none}
.search-go{margin:4px;align-self:stretch}

/* trust strip */
.trust{display:flex;gap:38px;flex-wrap:wrap;padding:22px 0 30px;color:#D6E3F3;font-size:14px;font-weight:600}
.trust div{display:flex;align-items:center;gap:9px}

/* ============ SECTIONS ============ */
.sec{padding:44px 0}
.sec-head{display:flex;align-items:baseline;gap:10px 16px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(21px,2.4vw,27px)}
.sec-head .more{margin-left:auto;color:var(--blue);font-weight:600;font-size:14.5px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.bg-surface{background:var(--surface)}

/* destinations */
.dest-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);gap:14px;overflow-x:auto;
  padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.dest-row::-webkit-scrollbar{display:none}
.dest{scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow-sm);transition:.18s}
.dest:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ratio{position:relative;width:100%;overflow:hidden;background:#E8EEF6}
.ratio>img{position:absolute;inset:0;width:100%;height:100%}
.r-4x3{aspect-ratio:4/3}.r-16x10{aspect-ratio:16/10}.r-16x7{aspect-ratio:16/7}.r-1x1{aspect-ratio:1/1}.r-3x1{aspect-ratio:3/1}
.cover{object-fit:cover}
.contain{object-fit:contain}
.dest .meta{padding:11px 13px 13px}
.dest .meta b{display:block;font-size:15px;letter-spacing:-.01em}
.dest .meta span{font-size:12.5px;color:var(--muted)}

/* vehicles */
.veh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.veh{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:.18s}
.veh:hover{box-shadow:var(--shadow-md);border-color:#CFDCEC;transform:translateY(-2px)}
.veh-media{background:#fff;padding:14px 16px 4px}
.veh-media .ratio{background:transparent}
.veh-body{padding:4px 15px 0;display:flex;flex-direction:column;gap:5px;flex:1}
.veh-cat{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7E93AF}
.veh-title{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:-1px}
.veh-title h3{font-size:17px;letter-spacing:-.02em}
.veh-title span{font-size:12px;color:var(--muted);font-weight:600}
.veh-specs{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px}
.veh-specs span{display:flex;align-items:center;gap:4px}
.veh-specs svg{color:#9CADC4}
.veh-sup{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:9px 0;
  border-top:1px solid #F0F4F9;margin-top:6px}
.veh-sup .dot{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;color:#fff;
  font-size:10.5px;font-weight:800;flex:none}
.veh-sup .rate{margin-left:auto;display:flex;align-items:center;gap:3px;color:#8A6300;background:#FFF6E0;
  border-radius:5px;padding:2px 7px;font-size:12px}
.veh-tags{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:13px}
.tag-green{background:var(--green-bg);color:var(--green);border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700}
.tag-blue{background:#EAF1FF;color:var(--blue-d);border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700}
.veh-price{border-top:1px solid var(--line);padding:12px 15px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.veh-price small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:2px;
  letter-spacing:.05em;text-transform:uppercase}
.veh-price .amt{font-size:24px;letter-spacing:-.035em;font-weight:800;line-height:1}
.veh-price .amt u{text-decoration:none;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.veh-price .tot{text-align:right}
.veh-price .tot .amt{font-size:17px;color:var(--ink);opacity:.72}
.veh-comm{background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:700;padding:9px 15px;
  display:flex;align-items:center;gap:7px;border-top:1px solid #F4E6C6}

/* platform panel */
.platform{background:linear-gradient(180deg,#E8F1FE,#DCEAFD);border-radius:16px;padding:34px;display:grid;grid-template-columns:.85fr 1.15fr;gap:28px;align-items:center}
.platform h2{font-size:clamp(22px,2.6vw,30px);line-height:1.15}
.plist{list-style:none;padding:0;margin:22px 0 26px;display:grid;gap:12px;font-weight:600;font-size:14.5px}
.plist li{display:flex;gap:10px;align-items:flex-start}
.mock{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;font-size:11px}
.mock-bar{background:var(--navy);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
.mock-body{display:grid;grid-template-columns:96px 1fr}
.mock-side{background:#F7FAFE;border-right:1px solid var(--line);padding:10px 8px;display:grid;gap:7px;color:var(--muted);font-weight:600}
.mock-side i{display:block;padding:4px 6px;border-radius:5px;font-style:normal}
.mock-side i.on{background:#E4EEFD;color:var(--blue)}
.mock-main{padding:11px}
.mock-tabs{display:flex;gap:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
.mock-tabs u{text-decoration:none;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:3px}
.mock-tr{display:grid;grid-template-columns:1fr 1fr 1fr .8fr;gap:6px;padding:6px 0;border-top:1px solid var(--line);color:var(--muted)}
.mock-tr b{color:var(--ink);font-weight:700}
.mock-tr em{font-style:normal;background:var(--green-bg);color:var(--green);border-radius:4px;padding:1px 6px;font-weight:700;justify-self:start}
.mock-voucher{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-md);padding:10px}

/* suppliers */
.sup-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.sup-box{border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;
  justify-content:center;padding:12px 10px;aspect-ratio:3/1;min-width:0;overflow:hidden}
.sup-box svg,.sup-box img{max-width:100%;max-height:100%;object-fit:contain}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px;justify-items:center}
.stat{display:flex;align-items:center;gap:12px}
.stat b{display:block;font-size:23px;letter-spacing:-.03em}
.stat span{font-size:13px;color:var(--muted)}

/* cta band */
.cta-band{background:var(--navy);color:#fff}
.cta-band .wrap{display:flex;align-items:center;gap:24px;padding-top:36px;padding-bottom:36px;flex-wrap:wrap}
.cta-band h2{font-size:clamp(21px,2.4vw,27px)}
.cta-band p{margin:8px 0 0;color:#BCCEE4;font-size:14.5px;max-width:430px}
.cta-band .acts{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}

/* footer */
.site-foot{background:var(--navy);color:#B9CBE2;border-top:1px solid rgba(255,255,255,.09);font-size:13.5px}
.foot-top{display:grid;grid-template-columns:1.5fr repeat(5,minmax(0,1fr)) auto;gap:26px;padding:38px 0 30px}
.foot-col h4{color:#fff;font-size:13px;letter-spacing:0;margin-bottom:12px;font-weight:700}
.foot-col a{display:block;padding:4px 0}
.foot-col a:hover{color:#fff}
.foot-blurb{max-width:210px;margin:14px 0 16px;line-height:1.55}
.socials{display:flex;gap:9px}
.socials i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-size:11px}
.foot-sel{border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:9px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;color:#fff;font-weight:600;font-size:13px}
.foot-bot{border-top:1px solid rgba(255,255,255,.1);padding:15px 0;display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px}
.foot-bot .r{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}

/* ============ INNER PAGES ============ */
.page-head{background:var(--navy);color:#fff;padding:28px 0 32px}
.page-body{padding-top:30px;padding-bottom:52px}
.page-body>.grid+.panel,.page-body>.panel+.panel{margin-top:18px}
.page-head h1{font-size:clamp(24px,3.2vw,34px)}
.page-head p{margin:9px 0 0;color:#BCCEE4;font-size:15px;max-width:620px}
.crumbs{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#8FA8C6;margin-bottom:10px;flex-wrap:wrap}
.crumbs a{color:#BCCEE4}.crumbs a:hover{color:#fff}
.crumbs span{color:#fff}

.results-wrap{display:grid;grid-template-columns:262px 1fr;gap:20px;padding-top:28px;padding-bottom:52px;align-items:start}
.filters .panel{position:sticky;top:78px}
.facet{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid #EEF2F8}
.facet:last-of-type{border-bottom:0}
.facet h4{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:800}
.fopt{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px;font-weight:600;cursor:pointer}
.fopt input{accent-color:var(--blue)}
.mini-field{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:7px;font-size:13px}
.mini-field span{color:var(--muted);display:flex}
.results-bar{display:flex;align-items:center;gap:12px;margin-bottom:13px;font-size:14.5px}
.sortsel{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.sortsel .sel{width:auto;padding:7px 10px}
.res-list{display:grid;gap:13px}
.res{display:grid;grid-template-columns:210px 1fr 196px;gap:16px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;box-shadow:var(--shadow-sm);overflow:hidden;transition:.18s}
.res:hover{box-shadow:var(--shadow-md);border-color:#CFDCEC}
.res-media{background:#fff;padding:16px 14px;display:flex;align-items:center;border-right:1px solid #F2F6FA}
.res-media .ratio{width:100%;background:transparent}
.res-mid{padding:15px 2px 15px 0;display:flex;flex-direction:column;gap:5px}
.res-mid .veh-cat{margin-bottom:-2px}
.res-mid .veh-sup{border-top:1px solid #F0F4F9;margin-top:4px;padding:9px 0 0}
.res-mid .veh-tags{padding:2px 0 0}
.res-specs{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.res-specs span{display:flex;align-items:center;gap:4px}
.res-specs svg{color:#9CADC4}
.res-price{border-left:1px solid var(--line);background:#FAFCFF;padding:14px;display:flex;flex-direction:column;
  align-items:flex-end;text-align:right;gap:2px}
.res-price small{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.res-price .amt{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.res-price .amt u{text-decoration:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.res-tot{font-size:12.5px;color:var(--muted);font-weight:600}
.res-rrp{font-size:12px;color:#9AAABF;text-decoration:line-through;margin-bottom:8px}
.res-price .btn{width:100%}
.res-comm{margin-top:7px;background:var(--amber-bg);color:var(--amber);border-radius:6px;padding:4px 8px;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.tag-grey{background:#EFF3F8;color:#5C7191;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700}

.detail-wrap{display:grid;grid-template-columns:1fr 336px;gap:20px;padding-top:28px;padding-bottom:52px;align-items:start}
.detail-side .sticky{position:sticky;top:78px}
.spec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.spec-grid small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.spec-grid b{font-size:14.5px}
.ins-row{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  font-size:14px;cursor:pointer}
.ins-row.on{border-color:var(--blue);background:#F5F9FF}
.ins-row input{accent-color:var(--blue)}
.ins-row .ins-p{margin-left:auto;white-space:nowrap}
.term{display:flex;gap:14px;align-items:baseline}
.term span{color:var(--muted);min-width:130px;font-weight:600}
.term b{flex:1}
.price-lines{display:grid;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.price-lines div{display:flex;justify-content:space-between;gap:12px}
.price-lines span{color:var(--muted)}
.pl-comm{color:var(--amber);font-weight:700}
.pl-comm span{color:var(--amber)}

.dest-hero{position:relative;color:#fff}
.dest-hero .ratio{max-height:390px}
.dest-hero-copy{position:absolute;left:0;right:0;bottom:0;padding-bottom:26px}
.dest-hero h1{font-size:clamp(28px,4vw,44px)}
.dest-hero p{margin:8px 0 0;color:#D6E3F3;max-width:520px}
.dest-facts{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;font-weight:600;color:#E4EDF8}
.dest-facts span{display:flex;align-items:center;gap:6px}

.faq{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{margin-left:auto;transition:.18s;color:var(--muted)}
.faq[open] summary svg{transform:rotate(180deg)}

const FOOT_ROUTES = { 'Find cars':'#/cars', 'Premium cars':'#/cars?cat=Premium', 'Vans':'#/cars?cat=Van',

const footLink = l => FOOT_ROUTES[l] || ('#/page/' + l.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));

/* brand tokens are applied by writing CSS variables — one source of truth */
function applyBranding(b, root) {
  const el = root || document.documentElement;
  el.style.setProperty('--blue', b.primary);
  el.style.setProperty('--navy', b.navy);
  el.style.setProperty('--surface', b.surface);
  el.style.setProperty('--radius', b.radius + 'px');
  el.style.setProperty('--blue-d', shade(b.primary, -18));
}
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16), amt = Math.round(2.55 * pct);
  const r = Math.min(255, Math.max(0, (n >> 16) + amt)),
        g = Math.min(255, Math.max(0, ((n >> 8) & 255) + amt)),
        b = Math.min(255, Math.max(0, (n & 255) + amt));
  return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

<script>
/* =======================================================================
   ADMIN STUDIO — shell, auth, navigation, dashboard
   ======================================================================= */

const NAV = [
  { group:'Dashboard',    single:'dashboard' },
  { group:'Reservations', single:'reservations' },
  { group:'Vouchers',     single:'vouchers' },
  { group:'Messages',     single:'messages', count:6 },
  { group:'Statistics',   single:'statistics' },
  { group:'Website', items:[
    { id:'homepage',    label:'Homepage',      icon:'home' },
    { id:'pages',       label:'Pages',         icon:'file' },
    { id:'navigation',  label:'Navigation',    icon:'list' },
    { id:'footer',      label:'Footer',        icon:'panel' },
    { id:'media',       label:'Media library', icon:'img' },
    { id:'branding',    label:'Branding',      icon:'palette' },
    { id:'seo',         label:'SEO',           icon:'search' }
  ]},
  { group:'Admin', sections:[
    { label:'Cars and suppliers', items:[
      { id:'vehicles',    label:'Cars',              icon:'car' },
      { id:'cargroups',   label:'Car groups',        icon:'layers' },

];

/* flatten every shape into one list of pages */
function navItems(g) {
  if (g.single) return [{ id:g.single, label:g.group, icon:'grid' }];
  if (g.items) return g.items;
  return g.sections.flatMap(sec => sec.items);
}

const GROUPS = NAV.map(g => g.group);
const GROUP_OF = {}, PAGE_TITLE = {};
NAV.forEach(g => navItems(g).forEach(i => {
  GROUP_OF[i.id] = g.group;
  PAGE_TITLE[i.id] = { label:i.label, group:g.group, soon:i.soon };
}));

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600);
}

/* ---------- dirty / publish ---------- */
function touch(what) {
  S.dirty = true;
  if (what) S.changes.unshift({ who:S.auth.name, what, when:stamp() });
  S.changes = S.changes.slice(0, 12);
  const d = document.getElementById('saveDot');
  if (d) { d.className = 'save-dot dirty'; d.querySelector('span').textContent = 'Unpublished changes'; }
}
function stamp() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  return `${p(n.getDate())}/${p(n.getMonth() + 1)}/${n.getFullYear()}, ${p(n.getHours())}:${p(n.getMinutes())}`;
}
function publishAll() {
  if (!canEdit()) return toast('Read-only viewers cannot publish.');
  S.published = clone(S.draft);
  S.dirty = false;
  S.lastPublished = stamp();
  S.changes.unshift({ who:S.auth.name, what:'Published all changes', when:S.lastPublished });
  render();
  toast('Published. The public site is now live with your changes.');
}

/* ---------- sign in ---------- */

}

/* ---------- studio chrome: top navigation, like an operations console ---------- */
function topNav() {
  const order = S.navOrder || GROUPS;
  return order.map((gname, gi) => {
    const g = NAV.find(x => x.group === gname);
    if (!g) return '';
    const visible = navItems(g).filter(i => canSee(i.id) && !(S.hideSoon && i.soon));
    if (!visible.length) return '';

    if (g.single) {
      return `<div class="tn-item"><button type="button" class="tn-btn ${S.adminPage === g.single ? 'on' : ''}"
        data-goto="${g.single}">${esc(g.group)}
        ${g.count ? `<span class="tn-count">${g.count}</span>` : ''}</button></div>`;
    }

    const holdsActive = visible.some(i => i.id === S.adminPage);
    const open = S.openMenu === gname;
    const link = i => `<button type="button" class="tn-link ${S.adminPage === i.id ? 'on' : ''}" data-goto="${i.id}">
      <span class="dot"></span>${i.label}${i.soon ? '<span class="soon">SOON</span>' : ''}</button>`;

    let body;
    if (g.sections) {
      const secIdx = S.openSection == null ? 0 : S.openSection;
      const secs = g.sections.filter(sec => sec.items.some(i => canSee(i.id) && !(S.hideSoon && i.soon)));
      body = `<div class="tn-two">
        <div class="tn-col1">${secs.map((sec, si) => `
          <button type="button" class="tn-sec ${si === secIdx ? 'on' : ''}" data-section="${si}">
            ${I(si === 0 ? 'car' : 'gear', 16)}${sec.label}<span class="caret">${I('right', 13)}</span></button>`).join('')}</div>

          .filter(i => canSee(i.id) && !(S.hideSoon && i.soon)).map(link).join('')}</div>
      </div>`;
    } else {
      body = visible.map(link).join('');
    }

    return `<div class="tn-item">
      <button type="button" class="tn-btn ${holdsActive ? 'on' : ''}" data-menu="${esc(gname)}"
        aria-expanded="${open}" aria-haspopup="true">${esc(gname)}
        <span class="caret">${I('chev', 13)}</span></button>
      ${open ? `<div class="tn-drop ${g.sections ? 'wide' : ''}">

          <input type="checkbox" id="hideSoon" ${S.hideSoon ? 'checked' : ''}><i></i>Hide unbuilt sections</label></div>
      </div>` : ''}
    </div>`;
  }).join('');
}

<script>
/* =======================================================================
   ADMIN STUDIO — content editors
   ======================================================================= */

const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setPath(o, p, v) {
  const k = p.split('.'), last = k.pop();
  k.reduce((a, x) => a[x], o)[last] = v;
}
const ro = () => canEdit() ? '' : 'disabled';

/* ---------------- shared record-page furniture ---------------- */
function tbSel(id, label, value, opts) {
  return `<span class="tb-sel">${I('chev', 12)}${label}:
    <select id="${id}">${opts.map(o =>
      `<option value="${esc(o[0])}" ${value === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></span>`;
}
function tbSearch(id, value, ph) {
  return `<span class="tb-search"><input id="${id}" value="${esc(value || '')}" placeholder="${ph || 'Search …'}">
    <span class="ic">${I('search', 15)}</span></span>`;
}
function tbPager(shown, total, page, per, key) {
  const last = Math.max(1, Math.ceil(total / per));
  return `<span class="tb-right">
    <span class="tb-page">${total ? (page * per + 1) + ' - ' + Math.min(total, page * per + shown) : 0} of ${total}</span>
    <button class="tb-btn" type="button" data-page="${key}:-1" ${page === 0 ? 'disabled' : ''}>${I('chev', 14)}</button>
    <button class="tb-btn" type="button" data-page="${key}:1" ${page >= last - 1 ? 'disabled' : ''}>${I('chev', 14)}</button>
    ${tbSel('perRows', 'Rows', String(per), [['10', '10 rows'], ['25', '25 rows'], ['50', '50 rows']])}
    <button class="tb-btn" type="button" data-refresh aria-label="Refresh">${I('clock', 14)}</button>
  </span>`;
}
const recCount = n => `<div class="rec-count">Displaying ${n} record${n === 1 ? '' : 's'}</div>`;
const perPage = () => S.perPage || 25;

/* ---------------- HOMEPAGE ---------------- */
const SECTION_FIELDS = {
  hero: [
    ['Headline', 'homepage.hero.headline', 'ta', 'Line breaks are kept exactly as you type them.'],
    ['Supporting text', 'homepage.hero.sub', 'ta'],
    ['Search button label', 'homepage.hero.cta', 'text'],
    ['Pick-up location', 'homepage.hero.location', 'text'],
    ['Pick-up', 'homepage.hero.pickup', 'text', 'Day first: DD/MM/YYYY.'],
    ['Drop-off', 'homepage.hero.dropoff', 'text'],
    ['Different-location label', 'homepage.hero.returnLabel', 'text'],
    ['Driver age label', 'homepage.hero.ageLabel', 'text'],
    ['Driver age range', 'homepage.hero.age', 'text']
  ],
  destinations: [['Section title', 'homepage.destinationsTitle', 'text', 'Cards come from Destinations. Only published destinations appear.']],
  vehicles: [['Section title', 'homepage.vehiclesTitle', 'text', 'Cards come from vehicles marked Featured.'],
             ['Link label', 'homepage.vehiclesMore', 'text']],
  platform: [['Title', 'homepage.platform.title', 'ta'], ['Button label', 'homepage.platform.cta', 'text']],
  suppliers: [['Section title', 'homepage.suppliersTitle', 'text', 'Logos come from suppliers marked Featured.']],
  cta: [['Title', 'homepage.cta.title', 'text'], ['Supporting text', 'homepage.cta.sub', 'ta'],
        ['Primary button', 'homepage.cta.primary', 'text'], ['Secondary button', 'homepage.cta.secondary', 'text']],
  trust: [] 
};

function fieldHtml(label, path, type, hint) {
  const v = esc(getPath(S.draft, path));
  const id = 'f_' + path.replace(/\./g, '_');
  const ctl = type === 'ta'
    ? `<textarea class="ta" id="${id}" data-bind="${path}" ${ro()}>${v}</textarea>`
    : `<input class="inp" id="${id}" data-bind="${path}" value="${v}" ${ro()}>`;
  return `<div class="field"><label for="${id}">${label}</label>${ctl}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}

function pageHomepage() {
  const secs = S.draft.homepage.sections;
  return `<div class="grid g-2-1">
    <div style="display:grid;gap:16px">
      <div class="panel">
        <div class="panel-h"><h3>Sections</h3>
          <div class="r"><span style="font-size:12px;color:var(--muted)">Drag, or use the arrows</span></div></div>
        <div class="panel-b"><div class="seclist" id="secList">
          ${secs.map((s, i) => `
            <div class="secrow" draggable="${canEdit()}" data-idx="${i}">
              <span class="grip" aria-hidden="true">⠿</span>
              <span><span class="lbl">${esc(s.label)}</span><span class="sub" style="display:block">${
                s.visible ? 'Visible on the site' : 'Hidden'}</span></span>
              <span class="r">
                <button class="ord" type="button" data-move="${i}:-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${I('up', 13)}</button>
                <button class="ord" type="button" data-move="${i}:1" aria-label="Move down" ${i === secs.length - 1 ? 'disabled' : ''}>${I('down', 13)}</button>
                <button class="ord" type="button" data-vis="${i}" aria-label="Toggle visibility">${I(s.visible ? 'eye' : 'eyeoff', 13)}</button>
                ${SECTION_FIELDS[s.id] && SECTION_FIELDS[s.id].length
                  ? `<button class="ord" type="button" data-editsec="${s.id}" aria-label="Edit">${I('edit', 13)}</button>` : ''}
              </span>
            </div>`).join('')}
        </div></div>
      </div>
      <div class="panel">
        <div class="panel-h"><h3>Hero image</h3><div class="r">
          <button class="btn btn-ghost" type="button" data-goto="media" style="padding:7px 12px">${I('img', 14)} Change</button></div></div>
        <div class="panel-b">
          <p style="margin:0 0 12px;font-size:13px;color:var(--muted)">
            A wide screen and a phone crop the same photograph very differently, so the hero keeps two markers.
            Drag each one to set what must stay in frame.</p>
          <div class="grid g2" style="gap:18px">
            ${focalEditor('homepage.hero.image', 'homepage.hero.focal', ['16:7', '21:9'], 'Desktop and tablet')}
            ${focalEditor('homepage.hero.image', 'homepage.hero.focalMobile', ['1:1', '4:5'], 'Phone')}
          </div>
        </div>
      </div>
    </div>
    <div class="panel" style="align-self:start">
      <div class="prev-bar">
        <div class="seg" id="devSeg">
          ${[['desktop', 'Desktop'], ['tablet', 'Tablet'], ['mobile', 'Mobile']].map(([k, l]) =>
            `<button type="button" data-dev="${k}" class="${S.device === k ? 'on' : ''}">${l}</button>`).join('')}
        </div>
        <label class="switch" style="margin-left:auto"><input type="checkbox" id="prevLive" checked><i></i>Live preview</label>
      </div>
      <div class="prev-stage"><div class="prev-shell" id="prevShell"></div></div>
    </div>
  </div>`;
}

const DEV_W = { desktop:1280, tablet:834, mobile:390 };
function paintPreview() {
  const shell = document.getElementById('prevShell');
  if (!shell) return;
  const w = DEV_W[S.device];
  const avail = shell.parentElement.clientWidth - 4;
  const scale = Math.min(1, avail / w);
  shell.style.width = w + 'px';
  shell.style.transform = `scale(${scale})`;
  shell.style.height = ''; 
  shell.innerHTML = renderPublic(S.draft);
  requestAnimationFrame(() => {
    shell.parentElement.style.height = (shell.scrollHeight * scale + 32) + 'px';
  });
}

/* ---------------- FOCAL POINT EDITOR ---------------- */
const RATIO = { '16:7':16 / 7, '21:9':21 / 9, '4:3':4 / 3, '16:10':16 / 10, '1:1':1, '4:5':4 / 5, '3:1':3 };
function focalEditor(imgPath, focalPath, ratios, label) {
  const key = getPath(S.draft, imgPath), f = getPath(S.draft, focalPath);
  return `<div class="focal-set">
    ${label ? `<div class="crop-lbl"><span>${label}</span><span class="focal-read">${f.x.toFixed(2)} / ${f.y.toFixed(2)}</span></div>` : ''}
    <div class="focal" data-focal="${focalPath}" data-img="${imgPath}">
      <img src="${img(key)}" alt="">
      <div class="gridlines"></div>
      <div class="dot" style="left:${f.x * 100}%;top:${f.y * 100}%"></div>
    </div>
    <div class="crops">
      ${ratios.map(r => `<div><div class="crop-lbl">${r}</div>
        <div class="ratio" style="aspect-ratio:${r.replace(':', '/')};border-radius:7px">
          <img class="cover" src="${img(key)}" alt="" style="${fp(f)}"></div></div>`).join('')}
    </div>
  </div>`;
}

function wireFocal(scope) {
  (scope || document).querySelectorAll('.focal').forEach(el => {
    if (el.dataset.wired) return;
    el.dataset.wired = '1';
    const move = e => {
      if (!canEdit()) return;
      const r = el.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
      const f = getPath(S.draft, el.dataset.focal);
      f.x = x; f.y = y;
      el.querySelector('.dot').style.left = x * 100 + '%';
      el.querySelector('.dot').style.top = y * 100 + '%';
      const set = el.closest('.focal-set');
      const read = set?.querySelector('.focal-read');
      if (read) read.textContent = x.toFixed(2) + ' / ' + y.toFixed(2);
      set?.querySelectorAll('.crops img').forEach(im => im.style.objectPosition = `${x * 100}% ${y * 100}%`);
      touch(null);
      schedulePreview();
    };
    let down = false;
    el.addEventListener('pointerdown', e => { down = true; el.setPointerCapture(e.pointerId); move(e); });
    el.addEventListener('pointermove', e => { if (down) move(e); });
    el.addEventListener('pointerup', e => { down = false; touch('Adjusted an image focal point'); });
    el.addEventListener('pointercancel', () => down = false);
  });
}
let prevT;
function schedulePreview() { clearTimeout(prevT); prevT = setTimeout(paintPreview, 160); }

/* ---------------- VEHICLES ---------------- */
function pageVehicles() {
  const q = (S.vq || '').toLowerCase();
  const all = S.draft.vehicles.filter(v => {
    const okQ = !q || (v.name + v.category + v.brand + v.model).toLowerCase().includes(q);
    return okQ && (!S.vcat || v.category === S.vcat) && (!S.vstat || v.status === S.vstat);

  <div class="toolbar">

    ${tbSel('vStat', 'Status', S.vstat || '', [['', 'All'], ['published', 'Published'], ['draft', 'Draft'], ['archived', 'Archived']])}

    ${tbPager(list.length, all.length, page, per, 'vPage')}
  </div>
  <div class="panel">
    <div class="panel-h"><h3>Vehicles</h3>
      <div class="r"><button class="add-btn" type="button" data-quick="newvehicle" ${ro()} aria-label="New vehicle">${I('plus', 17)}</button></div></div>

      <tbody>${list.length ? list.map(v => {
        const sup = supOf(S.draft, v.supplier);
        const dst = S.draft.destinations.find(x => x.id === v.destination);
        return `<tr>
          <td><div class="nm"><img class="thumb" src="${img(v.image)}" alt="">
            <span><b>${esc(v.name)}</b><small>${esc(v.orSimilar)} · ${v.seats} seats · ${esc(v.transmission)}</small></span></div></td>
          <td><span class="chip">${esc(v.category)}</span></td>
          <td>${esc(sup.name)}</td>
          <td>${esc(dst ? dst.name : '—')}</td>
          <td><b style="color:#2E3A59">${eur(v.net)}</b></td>
          <td>${eur(v.total)}</td>

          <td><span class="badge ${v.status === 'published' ? 'b-live' : v.status === 'draft' ? 'b-draft' : 'b-arch'}">${
            v.status[0].toUpperCase() + v.status.slice(1)}</span>
            ${v.featured ? '<span class="badge b-blue" style="margin-left:4px">Featured</span>' : ''}</td>
          <td><div class="act">
            <button type="button" data-vdup="${v.id}" aria-label="Duplicate" ${ro()}>${I('copy', 15)}</button>
            <button type="button" data-veh="${v.id}" aria-label="Edit">${I('edit', 15)}</button>

      }).join('') : `<tr><td colspan="9"><div class="empty"><h3>No vehicles match</h3>
        <p>Clear the filters or widen the search.</p></div></td></tr>`}</tbody>
    </table></div>
  </div>${recCount(all.length)}`;
}

function vehicleDrawer(id) {
  const v = S.draft.vehicles.find(x => x.id === id);

    const val = esc(v[key]);

      ${f('Air conditioning', 'aircon', 'switch')}${f('Instant confirmation', 'instant', 'switch')}
      ${f('Featured on the homepage', 'featured', 'switch')}
    </div>
    <div data-pane="p" class="hide">
      <div class="row2">${f('Daily net rate (€)', 'net', 'num')}${f('Total, 7 days (€)', 'total', 'num')}</div>
      <div class="row2">${f('Suggested retail (€)', 'rrp', 'num')}${f('Agency commission (€)', 'commission', 'num')}</div>

      <div class="field"><label>Choose from the media library</label>

          <button class="mtile ${m.src === v.image ? 'on' : ''}" type="button" data-vimg="${m.src}" ${ro()}>
            <div class="ratio r-16x10"><img class="contain" src="${img(m.src)}" alt=""></div>
            <div class="cap"><b>${esc(m.name)}</b></div></button>`).join('')}</div></div>
    </div>
    <div data-pane="s" class="hide">
      ${f('Cancellation terms', 'cancellation')}${f('Promotional badge', 'badge')}
      ${f('SEO title', 'seoTitle')}${f('Meta description', 'seoDesc')}
      ${f('Status', 'status', 'select', ['published', 'draft', 'archived'])}
    </div>`,
    { title: v.name, sub:'Vehicle', onSave: () => { touch('Edited vehicle — ' + v.name); render(); },
      extra:`<button class="btn btn-ghost" type="button" data-vdel="${v.id}" ${ro()}>${I('trash', 15)} Archive</button>` });

  const dr = document.querySelector('.drawer-b');
  dr.querySelectorAll('[data-v]').forEach(el => {
    el.addEventListener('input', () => {
      const k = el.dataset.v;
      v[k] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value);
      if (k === 'category') { v.image = CATIMG[v.category] || v.image; }
      touch(null);
    });
  });
  dr.querySelectorAll('[data-vimg]').forEach(b => b.addEventListener('click', () => {
    v.image = b.dataset.vimg;
    dr.querySelectorAll('[data-vimg]').forEach(x => x.classList.toggle('on', x === b));
    dr.querySelector('[data-pane="m"] .ratio img').src = img(v.image);
    touch('Changed vehicle image — ' + v.name);
  }));
  dr.querySelector('[data-vdel]')?.addEventListener('click', () => {
    v.status = 'archived'; closeDrawer(); touch('Archived vehicle — ' + v.name); render(); toast('Archived. Nothing is deleted in a prototype.');
  });
}

    <span class="tb-right"><span class="tb-page">${list.length} destinations</span>
      <button class="tb-btn" type="button" data-refresh aria-label="Refresh">${I('clock', 14)}</button></span>
  </div>

function destDrawer(id) {
  const d = S.draft.destinations.find(x => x.id === id);
  if (!d) return;
  const idx = S.draft.destinations.indexOf(d);
  const f = (label, key, type, opts, hint) => {
    if (type === 'select') return `<div class="field"><label>${label}</label>
      <select class="sel" data-d="${key}" ${ro()}>${opts.map(o => `<option ${d[key] === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
    if (type === 'ta') return `<div class="field"><label>${label}</label><textarea class="ta" data-d="${key}" ${ro()}>${esc(d[key])}</textarea></div>`;
    if (type === 'switch') return `<div class="field"><label class="switch"><input type="checkbox" data-d="${key}" ${d[key] ? 'checked' : ''} ${ro()}><i></i>${label}</label></div>`;
    return `<div class="field"><label>${label}</label><input class="inp" data-d="${key}" value="${esc(d[key])}" ${type === 'num' ? 'type="number"' : ''} ${ro()}>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
  };
  openDrawer(`
    ${f('Destination name', 'name')}
    <div class="row2">${f('Country', 'country')}${f('Type', 'type', 'select', ['City', 'Island', 'Resort', 'Airport', 'Port'])}</div>
    <div class="row2">${f('URL slug', 'slug', 'text', null, 'b2fleet.com/destinations/' + esc(d.slug))}${f('Starting price (€/day)', 'from', 'num')}</div>
    ${f('Short description', 'blurb', 'ta')}
    <div class="row2">${f('Featured on the homepage', 'featured', 'switch')}${f('Status', 'status', 'select', ['published', 'draft', 'archived'])}</div>
    <div class="field"><label>Card image and focal point</label>
      <div class="hint" style="margin:0 0 10px">Destination cards are 4:3, the destination hero is 16:7. Drag the marker to keep the landmark in frame in both.</div>
      ${focalEditor('destinations.' + idx + '.image', 'destinations.' + idx + '.focal', ['4:3', '16:7', '1:1'])}</div>
    ${f('SEO title', 'seoTitle')}${f('Meta description', 'seoDesc', 'ta')}`,
    { title:d.name, sub:'Destination', onSave: () => { touch('Edited destination — ' + d.name); render(); } });

  const dr = document.querySelector('.drawer-b');
  dr.querySelectorAll('[data-d]').forEach(el => el.addEventListener('input', () => {
    const k = el.dataset.d;
    d[k] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value);
    touch(null);
  }));
  wireFocal(dr);
}

/* ---------------- SUPPLIERS ---------------- */
function pageSuppliers() {
  return `<div class="panel">

}

function supDrawer(id) {
  const s = S.draft.suppliers.find(x => x.id === id);

  const f = (label, key, type) => type === 'switch'
    ? `<div class="field"><label class="switch"><input type="checkbox" data-s="${key}" ${s[key] ? 'checked' : ''} ${ro()}><i></i>${label}</label></div>`

</script>
<script>
/* =======================================================================
   PUBLIC PAGES — everything the header, footer and cards link to
   ======================================================================= */

function pageHead(title, sub, crumbs) {
  return `<div class="page-head"><div class="wrap">
    ${crumbs ? `<nav class="crumbs">${crumbs.map((c, i) => i === crumbs.length - 1
      ? `<span>${esc(c[0])}</span>` : `<a href="${c[1]}">${esc(c[0])}</a>${I('chev', 13)}`).join('')}</nav>` : ''}
    <h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}
  </div></div>`;
}

/* ---------------- FIND CARS ---------------- */
function carsPage(site) {
  const f = S.filters || (S.filters = { cat:'', trans:'', sup:'', max:100, sort:'price' });
  let list = site.vehicles.filter(v => v.status === 'published')
    .filter(v => (!f.cat || v.category === f.cat) && (!f.trans || v.transmission === f.trans)
      && (!f.sup || v.supplier === f.sup) && v.net <= f.max);
  list.sort((a, b) => f.sort === 'price' ? a.net - b.net
    : f.sort === 'priceDesc' ? b.net - a.net
    : f.sort === 'commission' ? b.commission - a.commission
    : supOf(site, b.supplier).rating - supOf(site, a.supplier).rating);

  const facet = (label, key, opts) => `<div class="facet"><h4>${label}</h4>
    ${opts.map(o => `<label class="fopt"><input type="radio" name="f_${key}" data-filter="${key}" value="${o[0]}"
      ${f[key] === o[0] ? 'checked' : ''}><span>${o[1]}</span></label>`).join('')}</div>`;

  return pageHead('Find cars', `${list.length} vehicles across ${new Set(list.map(v => v.destination)).size} destinations · net B2B rates`,
    [['Home', '#/'], ['Find cars']]) + `
  <div class="wrap results-wrap">
    <aside class="filters">
      <div class="panel"><div class="panel-b">
        <div class="facet"><h4>Pick-up</h4>
          <div class="mini-field"><span>${I('pin', 14)}</span><b>${esc(site.homepage.hero.location)}</b></div>
          <div class="mini-field"><span>${I('cal', 14)}</span><b>${esc(site.homepage.hero.pickup)}</b></div>
          <div class="mini-field"><span>${I('cal', 14)}</span><b>${esc(site.homepage.hero.dropoff)}</b></div></div>
        ${facet('Category', 'cat', [['', 'All categories'], ...CATS.map(c => [c, c])])}
        ${facet('Transmission', 'trans', [['', 'Any'], ['Manual', 'Manual'], ['Automatic', 'Automatic']])}
        ${facet('Supplier', 'sup', [['', 'All suppliers'], ...site.suppliers.map(s => [s.id, s.name])])}
        <div class="facet"><h4>Max net rate — ${eur(f.max)}/day</h4>
          <input type="range" min="10" max="100" step="2" value="${f.max}" data-filter="max" style="width:100%"></div>
        <button class="btn btn-ghost" type="button" data-filter-reset style="width:100%">Clear filters</button>
      </div></div>
    </aside>
    <div>
      <div class="results-bar">
        <b>${list.length} results</b>
        <label class="sortsel">Sort
          <select class="sel" data-filter="sort">
            <option value="price" ${f.sort === 'price' ? 'selected' : ''}>Lowest net rate</option>
            <option value="priceDesc" ${f.sort === 'priceDesc' ? 'selected' : ''}>Highest net rate</option>
            <option value="commission" ${f.sort === 'commission' ? 'selected' : ''}>Best commission</option>
            <option value="rating" ${f.sort === 'rating' ? 'selected' : ''}>Supplier rating</option>
          </select></label>
      </div>
      ${list.length ? `<div class="res-list">${list.map(v => resultRow(site, v)).join('')}</div>`
        : `<div class="panel"><div class="empty"><h3>Nothing matches those filters</h3>
           <p>Try widening the price range or clearing the supplier filter.</p></div></div>`}
    </div>
  </div>`;
}

function resultRow(site, v) {
  const s = supOf(site, v.supplier), d = site.destinations.find(x => x.id === v.destination);
  return `<article class="res">
    <div class="res-media"><div class="ratio r-16x10">
      <img class="contain" src="${img(v.image)}" alt="${esc(v.name)} ${esc(v.orSimilar)}"></div></div>
    <div class="res-mid">
      <div class="veh-cat">${esc(v.category)}</div>

      <div class="res-specs">
        <span>${I('seat', 14)}${v.seats} seats</span>

      <div class="veh-sup">

        <span class="rate">${I('star', 12)}${s.rating}</span></div>

        ${v.cancellation ? '<span class="tag-green">Free cancellation</span>' : ''}

}

  const ins = [['Basic cover', 'Included', 0], ['Medium excess reduction', 'Recommended', 8],

          <p style="color:var(--muted);margin:8px 0 0;font-size:14px">
            ${esc(v.brand)} ${esc(v.model)}, ${v.year} · supplied by ${esc(s.name)} in ${esc(d ? d.name : '')}</p>
          <div class="spec-grid">${spec.map(x => `<div><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div>

      <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Insurance</h3></div>
        <div class="panel-b" style="display:grid;gap:9px">
          ${ins.map((x, i) => `<label class="ins-row${i === 0 ? ' on' : ''}">
            <input type="radio" name="ins" ${i === 0 ? 'checked' : ''}>
            <span><b>${x[0]}</b>${x[1] ? `<span class="tag-blue" style="margin-left:7px">${x[1]}</span>` : ''}</span>
            <b class="ins-p">${x[2] ? '+' + eur(x[2]) + '/day' : 'Included'}</b></label>`).join('')}
        </div></div>

      <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Terms</h3></div>
        <div class="panel-b" style="display:grid;gap:10px;font-size:14px">
          ${[[ 'Cancellation', v.cancellation], ['Deposit', v.deposit], ['Confirmation', v.instant ? 'Instant' : 'On request, usually within 4 hours'],
             ['Supplier policy', s.cancel], ['Driver age', site.homepage.hero.age]]
            .map(x => `<div class="term"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}
        </div></div>
    </div>

    <aside class="detail-side">
      <div class="panel sticky"><div class="panel-b">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <div><small style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Net B2B</small>
            <div class="amt" style="font-size:30px;font-weight:800;letter-spacing:-.035em">${eur(v.net)}<u style="font-size:14px;font-weight:600;color:var(--muted);text-decoration:none">/day</u></div></div>
        </div>
        <div class="price-lines">
          <div><span>7 days × ${eur(v.net)}</span><b>${eur(v.total)}</b></div>
          <div><span>Suggested retail</span><b>${eur(v.rrp)}</b></div>
          <div class="pl-comm"><span>Your commission</span><b>${eur(v.commission)}</b></div>
        </div>
        <a class="btn btn-pri btn-lg" href="#/bookings" style="width:100%;margin-top:12px">Book at net rate</a>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5">
          ${v.instant ? 'Confirmed instantly. ' : 'Confirmed by the supplier, usually within 4 hours. '}

      </div></div>
      <div class="panel" style="margin-top:16px"><div class="panel-b">
        <div class="sup-box" style="aspect-ratio:auto;height:52px;border:0;padding:0;justify-content:flex-start">${supplierLogo(s)}</div>

/* ---------------- SUPPLIERS ---------------- */
function suppliersPage(site) {

    [['Home', '#/'], ['Suppliers']]) + `

/* ---------------- HELP ---------------- */
function helpPage() {

    ['Can I put my own branding on the voucher?', 'Yes. Upload your agency logo and contact details once, and every voucher is issued in your branding. The supplier name still appears because the desk needs it.'],
    ['What happens if a car is unavailable at the desk?', 'The supplier must provide an equivalent or better vehicle at no extra cost. If they cannot, we refund in full and cover reasonable alternative arrangements.'],
    ['How do cancellations work?', 'Cancellation windows vary by supplier and are shown on every vehicle before you book. Inside the free window, cancellation is instant and the commission is simply reversed.'],

/* ---------------- DESTINATION ---------------- */
function destinationPage(site, slug) {
  const d = site.destinations.find(x => x.slug === slug && x.status === 'published');
  if (!d) return notFound('That destination is not published yet.');
  const cars = site.vehicles.filter(v => v.destination === d.id && v.status === 'published');
  return `<section class="dest-hero">
    <div class="ratio r-16x7"><img class="cover" src="${img(d.image)}" alt="${esc(d.name)}" style="${fp(d.focal)}"></div>
    <div class="hero-scrim"></div>
    <div class="wrap dest-hero-copy">
      <nav class="crumbs on-dark"><a href="#/">Home</a>${I('chev', 13)}<span>${esc(d.name)}</span></nav>
      <h1>${esc(d.name)}</h1>
      <p>${esc(d.blurb)}</p>
      <div class="dest-facts"><span>${I('car', 16)}${cars.length} vehicles</span>
        <span>${I('money', 16)}from ${eur(d.from)}/day</span><span>${I('pin', 16)}${esc(d.country)}</span></div>
    </div></section>
  <div class="wrap page-body">
    <div class="sec-head"><h2>Cars in ${esc(d.name)}</h2><a class="more" href="#/cars">All destinations ${I('right', 14)}</a></div>
    ${cars.length ? `<div class="veh-grid">${cars.map(v => vehicleCard(site, v)).join('')}</div>`
      : `<div class="panel"><div class="empty"><h3>No published vehicles here yet</h3>
         <p>Assign vehicles to this destination in the studio and they will appear.</p></div></div>`}
  </div>`;
}

/* ---------------- GENERIC / 404 ---------------- */
function simplePage(slug) {
  const title = slug.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase());
  return pageHead(title, null, [['Home', '#/'], [title]]) + `
  <div class="wrap page-body"><div class="panel"><div class="empty">
    <div style="color:#C3D3E6;margin-bottom:12px">${I('file', 40)}</div>
    <h3>${esc(title)} has no content yet</h3>
    <p>This page exists as a route so the navigation is honest, but its blocks have not been written.
      In the studio it would be built from the block library under Pages.</p>
    <div style="margin-top:16px"><a class="btn btn-ghost" href="#/">Back to the homepage</a></div>
  </div></div></div>`;
}
function notFound(msg) {
  return pageHead('Not found', null, [['Home', '#/'], ['Not found']]) + `
  <div class="wrap page-body"><div class="panel"><div class="empty">
    <h3>${esc(msg)}</h3><p>It may be in draft, or the link may be out of date.</p>
    <div style="margin-top:16px"><a class="btn btn-pri" href="#/cars">Browse all cars</a></div>
  </div></div></div>`;
}

/* ---------------- dispatch ---------------- */
function publicBody(site) {
  const r = S.route || { name:'home' };
  switch (r.name) {
    case 'cars': return carsPage(site);
    case 'car': return vehiclePage(site, r.param);
    case 'suppliers': return suppliersPage(site);
    case 'bookings': return bookingsPage(site);
    case 'help': return helpPage();
    case 'destination': return destinationPage(site, r.param);
    case 'page': return simplePage(r.param);
    default: return homeBody(site);
  }
}

function addUpload(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const id = 'm-up-' + Date.now() + Math.random().toString(36).slice(2, 6);
      ASSETS[id] = rd.result;
      S.draft.media.unshift({ id, name:file.name, src:id, w:im.naturalWidth, h:im.naturalHeight,
        alt:'', focal:{ x:.5, y:.5 }, folder:'Uploads', usedIn:[] });
      S.mediaSel = id; S.mFolder = '';
      touch('Uploaded ' + file.name);
      render();
      toast(`Uploaded at ${im.naturalWidth} × ${im.naturalHeight}. Drag the marker to set the crop.`);
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

      <div class="field"><label class="switch"><input type="checkbox" checked ${ro()}><i></i>Show net rates and commission publicly</label></div>
    </div></div>
    <div class="panel"><div class="panel-h"><h3>What is not in this prototype</h3></div><div class="panel-b" style="display:grid;gap:9px">
      ${['Real authentication and sessions', 'A persistent database', 'Server-side image derivatives', 'Transactional email', 'PDF voucher rendering', 'Payment and settlement', 'Revision history and scheduling']
        .map(x => `<div class="alert a-note">${I('clock', 16)}<div>${x}</div></div>`).join('')}
    </div></div></div>`;
}

function pagePages() {
  const pages = ['About', 'Contact', 'Help', 'Partner information', 'Supplier onboarding', 'Terms', 'Privacy', 'Cancellation policy', 'Booking guide'];
  const blocks = ['Heading', 'Rich text', 'Image', 'Image and text', 'Feature grid', 'Statistics', 'FAQ', 'CTA', 'Testimonial', 'Logo strip', 'Vehicle carousel', 'Destination carousel'];
  return `<div class="grid g2">
    <div class="panel"><div class="panel-h"><h3>Pages</h3></div><div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>Page</th><th>URL</th><th>Blocks</th><th>Status</th></tr></thead>
      <tbody>${pages.map((p, i) => `<tr><td><b>${p}</b></td>
        <td style="font-family:ui-monospace,monospace;font-size:12.5px;color:var(--muted)">/${p.toLowerCase().replace(/ /g, '-')}</td>
        <td>${3 + (i % 4)}</td>
        <td><span class="badge ${i === 4 ? 'b-draft' : 'b-live'}">${i === 4 ? 'Draft' : 'Published'}</span></td></tr>`).join('')}
      </tbody></table></div>${recCount(pages.length)}</div>
    <div class="panel"><div class="panel-h"><h3>Available blocks</h3></div><div class="panel-b">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${blocks.map(b => `<span class="chip" style="padding:7px 11px">${b}</span>`).join('')}</div>
      <div class="alert a-note" style="margin-top:14px">${I('clock', 16)}<div>
        The block editor itself is the next thing to build. The page list and block vocabulary are here so the shape is agreed first.</div></div>
    </div></div></div>`;
}

function pageStub(id) {
  const m = PAGE_TITLE[id];
  return `<div class="panel"><div class="empty">
    <div style="color:#C3D3E6;margin-bottom:12px">${I('clock', 40)}</div>
    <h3>${esc(m.label)} is not in this prototype</h3>
    <p>The navigation is complete on purpose, so the shape of the studio is agreed before any of it is built.
    This section is listed, scoped and deliberately empty — not a button that pretends to work.</p>
    <div style="margin-top:16px"><button class="btn btn-ghost" type="button" data-goto="dashboard">Back to the dashboard</button></div>
  </div></div>`;
}

/* ---------------- page router ---------------- */
function adminPage() {
  const p = S.adminPage;
  if (!canSee(p)) return `<div class="panel"><div class="empty"><h3>Not available for your role</h3>
    <p>You are signed in as ${ROLES[S.auth.role].label}. This section is outside your permissions.</p></div></div>`;
  if (PAGE_TITLE[p] && PAGE_TITLE[p].soon) return pageStub(p);
  return ({ dashboard, homepage:pageHomepage, vehicles:pageVehicles, destinations:pageDestinations,
    suppliers:pageSuppliers, media:pageMedia, branding:pageBranding,
    navigation:pageNavigation, footer:pageNavigation, seo:pageSeo, users:pageUsers,
    settings:pageSettings, pages:pagePages,
    reservations:pageReservations, vouchers:pageVouchers, messages:pageMessages, statistics:pageStatistics,
    cargroups:pageCarGroups, carattrs:pageCarAttributes, carcats:pageCarCategories,
    extras:pageExtras, insurance:pageInsurance, pricelists:pagePricelists }[p] || dashboard)();
}

/* ---------------- drawer ---------------- */
function openDrawer(html, o = {}) {
  closeDrawer();
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true">
      <div class="drawer-h"><div><div class="crumb" style="font-size:12px;color:var(--muted);font-weight:600">${esc(o.sub || '')}</div>
        <h3>${esc(o.title || '')}</h3></div>
        <button class="icon-btn" type="button" data-close style="margin-left:auto">${I('x', 17)}</button></div>
      <div class="drawer-b">${html}</div>
      <div class="drawer-f">${o.extra || ''}<div class="r">
        <button class="btn btn-ghost" type="button" data-close>${o.noSave ? 'Close' : 'Cancel'}</button>
        ${o.noSave ? '' : `<button class="btn btn-pri" type="button" data-save ${ro()}>Save</button>`}</div></div>
    </aside>`;
  wrap.id = 'drawerWrap';
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeDrawer));
  wrap.querySelector('[data-save]')?.addEventListener('click', () => { o.onSave && o.onSave(); closeDrawer(); toast('Saved to draft. Publish when ready.'); });
  wrap.querySelectorAll('[data-tabs] button').forEach(b => b.addEventListener('click', () => {
    wrap.querySelectorAll('[data-tabs] button').forEach(x => x.classList.toggle('on', x === b));
    wrap.querySelectorAll('[data-pane]').forEach(p => p.classList.toggle('hide', p.dataset.pane !== b.dataset.tab));
  }));
  wireFocal(wrap);
}
function closeDrawer() { document.getElementById('drawerWrap')?.remove(); }

/* ---------------- render + events ---------------- */
function render() {
  const app = document.getElementById('app');
  applyBranding(S.view === 'admin' ? S.draft.branding : S.published.branding);
  if (S.view === 'admin') {
    app.innerHTML = S.auth ? studioView() : signinView();
  } else {
    const site = S.previewDraft ? S.draft : S.published;
    app.innerHTML =
      (S.dirty && S.auth ? `<div class="draft-ribbon">${I('eye', 16)}
        <span>${S.previewDraft ? 'Previewing unpublished draft' : 'There are unpublished changes'}</span>
        <button type="button" id="togglePrev">${S.previewDraft ? 'Show published' : 'Preview draft'}</button></div>` : '') +
      renderPublic(site) +
      `<a class="btn btn-dark to-studio" href="#/admin">${I('gear', 16)} Studio</a>`;
  }
  wireFocal(document);
  if (document.getElementById('prevShell')) paintPreview();
  window.scrollTo(0, S.keepScroll || 0);
  S.keepScroll = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-goto],[data-quick],[data-move],[data-vis],[data-editsec],[data-veh],[data-vdup],[data-dest],[data-sup],[data-media],[data-book],[data-dev],[data-navmove],[data-navdel],[data-menu],[data-gmove],[data-logo],[data-page],[data-refresh],[data-res],[data-msg],[data-section],#burger,#menuScrim,#publishBtn,#sideToggle,#signout,#doSignin,#togglePrev,#mUploadBtn,#mReplace,#mHere,#navAdd,#sideScrim');
  if (!t) return;
  const d = t.dataset;

  if (t.id === 'doSignin') {
    const role = document.querySelector('input[name=role]:checked').value;
    S.auth = { name: role === 'editor' ? 'Sharol Pinto' : 'Amir', role };
    if (!canSee(S.adminPage)) S.adminPage = 'dashboard';
    render(); toast('Signed in as ' + ROLES[role].label + '.'); return;
  }
  if (t.id === 'burger') { S.mobileNav = !S.mobileNav; render(); return; }
  if (t.id === 'signout') { S.auth = null; render(); return; }
  if (t.id === 'publishBtn') return publishAll();
  if (t.id === 'sideToggle') { S.sideOpen = !S.sideOpen; S.openMenu = null; render(); return; }
  if (t.id === 'menuScrim') { S.openMenu = null; render(); return; }
  if (t.id === 'togglePrev') { S.previewDraft = !S.previewDraft; render(); return; }
  if (t.id === 'mUploadBtn') return document.getElementById('mFile').click();
  if (d.logo) { S.logoSlot = d.logo; document.getElementById('logoFile').click(); return; }
  if (t.id === 'mReplace' || t.id === 'mHere') return toast(t.id === 'mReplace'
    ? 'Would replace this file in every place it is used.' : 'Would replace this file here only.');
  if (t.id === 'navAdd') { S.draft.nav.main.push({ label:'New link', href:'#/' }); touch('Added a navigation link'); render(); return; }

  if (d.refresh !== undefined) { render(); toast('Refreshed.'); return; }
  if (d.page) {
    const [key, dir] = d.page.split(':');
    S[key] = Math.max(0, (S[key] || 0) + Number(dir));
    S.keepScroll = window.scrollY; render(); return;
  }
  if (d.section !== undefined) { S.openSection = Number(d.section); render(); return; }
  if (d.res) return resDrawer(d.res);
  if (d.msg !== undefined) return msgDrawer(d.msg);
  if (d.menu) { S.openMenu = S.openMenu === d.menu ? null : d.menu; S.openSection = 0; render(); return; }
  if (d.gmove) {
    const [i, dir] = d.gmove.split(':').map(Number);
    const a = S.navOrder || (S.navOrder = GROUPS.slice());
    if (a[i + dir] === undefined) return;
    [a[i], a[i + dir]] = [a[i + dir], a[i]];
    S.openMenu = a[i + dir]; render(); return;
  }
  if (d.goto) { S.adminPage = d.goto; S.sideOpen = false; S.openMenu = null; if (S.view !== 'admin') location.hash = '#/admin'; else render(); return; }
  if (d.dev) { S.device = d.dev; render(); return; }

  if (d.move) {
    const [i, dir] = d.move.split(':').map(Number), a = S.draft.homepage.sections;
    [a[i], a[i + dir]] = [a[i + dir], a[i]];
    touch('Reordered homepage sections'); render(); return;
  }
  if (d.vis !== undefined && d.vis !== '') {
    const s = S.draft.homepage.sections[Number(d.vis)];
    s.visible = !s.visible; touch((s.visible ? 'Showed' : 'Hid') + ' homepage section — ' + s.label); render(); return;
  }
  if (d.editsec) {
    const id = d.editsec;
    openDrawer(SECTION_FIELDS[id].map(f => fieldHtml(f[0], f[1], f[2], f[3])).join(''),
      { title: S.draft.homepage.sections.find(s => s.id === id).label, sub:'Homepage section',
        onSave: () => { touch('Edited homepage section'); render(); } });
    return;
  }
  if (d.navmove) {
    const [i, dir] = d.navmove.split(':').map(Number), a = S.draft.nav.main;
    [a[i], a[i + dir]] = [a[i + dir], a[i]]; touch('Reordered navigation'); render(); return;
  }
  if (d.navdel) { S.draft.nav.main.splice(Number(d.navdel), 1); touch('Removed a navigation link'); render(); return; }

  if (d.veh) return vehicleDrawer(d.veh);
  if (d.vdup) {
    const v = clone(S.draft.vehicles.find(x => x.id === d.vdup));
    v.id = 'v' + Date.now(); v.name += ' (copy)'; v.status = 'draft'; v.featured = false;
    S.draft.vehicles.unshift(v); touch('Duplicated vehicle'); render(); toast('Duplicated as a draft.'); return;
  }
  if (d.dest) return destDrawer(d.dest);
  if (d.sup) return supDrawer(d.sup);
  if (d.book) return bookingDrawer(d.book);
  if (d.media) { S.mediaSel = d.media; S.keepScroll = window.scrollY; render(); return; }

  if (d.quick === 'newvehicle') {
    const v = veh({ id:'v' + Date.now(), name:'New vehicle', brand:'', model:'', category:'Economy',
      seats:5, bags:1, transmission:'Manual', supplier:'medrent', destination:'athens', net:20, status:'draft' });
    S.draft.vehicles.unshift(v); S.adminPage = 'vehicles'; touch('Created a vehicle'); render(); vehicleDrawer(v.id); return;
  }
  if (d.quick === 'newdest') {
    const x = { id:'d' + Date.now(), name:'New destination', country:'', type:'City', slug:'new-destination',
      from:20, image:'athens', focal:{ x:.5, y:.5 }, blurb:'', featured:false, status:'draft', vehicles:0,
      seoTitle:'', seoDesc:'' };
    S.draft.destinations.push(x); S.adminPage = 'destinations'; touch('Created a destination'); render(); destDrawer(x.id); return;
  }
});

/* live-bound inputs */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) { setPath(S.draft, el.dataset.bind, el.value); touch(null); schedulePreview(); }
  if (el.dataset.brand) {
    S.draft.branding[el.dataset.brand] = el.value;
    document.querySelectorAll(`[data-brand="${el.dataset.brand}"]`).forEach(o => { if (o !== el) o.value = el.value; });
    applyBranding(S.draft.branding); touch(null); schedulePreview();
  }
  if (el.dataset.nav !== undefined && el.dataset.nav !== '') { S.draft.nav.main[Number(el.dataset.nav)].label = el.value; touch(null); }
  if (el.id === 'hideSoon') { S.hideSoon = el.checked; render(); return; }
  if (el.id === 'bRad') { S.draft.branding.radius = Number(el.value); document.getElementById('radVal').textContent = el.value + 'px'; applyBranding(S.draft.branding); touch(null); }
  if (el.id === 'mAlt') { const m = S.draft.media.find(x => x.id === (S.mediaSel || S.draft.media[0].id)); m.alt = el.value; touch(null); }
  if (el.id === 'rSearch') { S.rq = el.value; const b = document.getElementById('adminBody');
    b.innerHTML = pageReservations(); const f = document.getElementById('rSearch'); f.focus(); f.setSelectionRange(99, 99); return; }
  if (el.id === 'vchSearch') { S.vchq = el.value; const b = document.getElementById('adminBody');
    b.innerHTML = pageVouchers(); const f = document.getElementById('vchSearch'); f.focus(); f.setSelectionRange(99, 99); return; }
  if (el.id === 'mSearch') { S.mq = el.value; const b = document.getElementById('adminBody');
    b.innerHTML = pageMessages(); const f = document.getElementById('mSearch'); f.focus(); f.setSelectionRange(99, 99); return; }
  if (el.id === 'bSearch') { S.bq = el.value; const b = document.getElementById('adminBody');
    b.innerHTML = pageBookings(); const f = document.getElementById('bSearch'); f.focus(); f.setSelectionRange(99, 99); return; }
  if (el.id === 'vSearch') { S.vq = el.value; S.vPage = 0; const b = document.getElementById('adminBody'); b.innerHTML = pageVehicles(); document.getElementById('vSearch').focus(); document.getElementById('vSearch').setSelectionRange(99, 99); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'rStat') { S.rstat = el.value; render(); return; }
  if (el.id === 'vType') { S.vtype = el.value; render(); return; }
  if (el.id === 'vStatus') { S.vstatus = el.value; render(); return; }
  if (el.id === 'statView') { S.statView = el.value; render(); return; }
  if (el.id === 'vStat') { S.vstat = el.value; S.vPage = 0; render(); return; }
  if (el.id === 'dStat') { S.dstat = el.value; render(); return; }
  if (el.id === 'bStat') { S.bstat = el.value; render(); return; }
  if (el.id === 'perRows') { S.perPage = Number(el.value); S.vPage = 0; render(); return; }
  if (el.id === 'hideSoon') { S.hideSoon = el.checked; render(); return; }
  if (el.id === 'vCat') { S.vcat = el.value; render(); }
  if (el.id === 'mFolder') { S.mFolder = el.value; render(); }
  if (el.id === 'mFile') { [...el.files].forEach(addUpload); }
  if (el.id === 'logoFile' && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { ASSETS[S.logoSlot] = rd.result; touch('Replaced ' + S.logoSlot); render();
      toast('Swapped live. Drop the same file into assets/branding/ to keep it.'); };
    rd.readAsDataURL(el.files[0]);
  }
  if (el.name === 'role') document.querySelectorAll('.role-pick label').forEach(l => l.classList.toggle('on', l.contains(el)));
});

/* drag to reorder homepage sections */
let dragI = null;
document.addEventListener('dragstart', e => {
  const r = e.target.closest('.secrow'); if (!r || !r.dataset.idx) return;
  dragI = Number(r.dataset.idx); r.classList.add('dragging');
});
document.addEventListener('dragover', e => {
  const r = e.target.closest('.secrow'); if (!r || dragI === null) return;
  e.preventDefault(); r.classList.add('over');
});
document.addEventListener('dragleave', e => e.target.closest('.secrow')?.classList.remove('over'));
document.addEventListener('drop', e => {
  const r = e.target.closest('.secrow'); if (!r || dragI === null) return;
  e.preventDefault();
  const to = Number(r.dataset.idx), a = S.draft.homepage.sections;
  a.splice(to, 0, a.splice(dragI, 1)[0]); dragI = null;
  touch('Reordered homepage sections'); render();
});
document.addEventListener('dragend', () => { dragI = null; document.querySelectorAll('.secrow').forEach(r => r.classList.remove('dragging', 'over')); });

/* drop files onto the media library */
['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest('#dropzone'); if (!z) return;
  e.preventDefault();
  if (ev === 'dragover') z.classList.add('hot');
  else { z.classList.remove('hot'); [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')).forEach(addUpload); }
}));

/* public page interactions */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-bktab],[data-filter-reset]');
  if (!t) return;
  if (t.dataset.bktab !== undefined) { S.bkTab = t.dataset.bktab; render(); return; }
  S.filters = { cat:'', trans:'', sup:'', max:100, sort:'price' };
  S.keepScroll = window.scrollY; render();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.filter;
  if (!k) return;
  S.filters[k] = k === 'max' ? Number(e.target.value) : e.target.value;
  S.keepScroll = window.scrollY;
  render();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.name === 'ins') el.closest('.panel-b')?.querySelectorAll('.ins-row')
    .forEach(r => r.classList.toggle('on', r.contains(el)));
});

/* favicon follows the brand mark */
(function () {
  const l = document.querySelector('link[rel=icon]');
  if (l && ASSETS['logo-mark']) l.href = ASSETS['logo-mark'];
})();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.openMenu) { S.openMenu = null; render(); }
});

/* routing */
function route() {
  S.mobileNav = false; S.openMenu = null;
  const raw = location.hash || '#/';
  const [path, qs] = raw.split('?');
  const seg = path.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (seg[0] === 'admin') {
    S.view = 'admin';
    if (seg[1] && PAGE_TITLE[seg[1]]) S.adminPage = seg[1];
  } else {
    S.view = 'public';
    const q = new URLSearchParams(qs || '');
    S.filters = S.filters || { cat:'', trans:'', sup:'', max:100, sort:'price' };
    if (q.get('cat')) S.filters.cat = q.get('cat');
    if (q.get('sup')) S.filters.sup = q.get('sup');
    S.route = !seg.length ? { name:'home' }
      : seg[0] === 'cars' && seg[1] ? { name:'car', param:seg[1] }
      : seg[0] === 'cars' ? { name:'cars' }
      : seg[0] === 'destinations' ? { name:'destination', param:seg[1] }
      : seg[0] === 'page' ? { name:'page', param:seg[1] || 'about' }
      : ['suppliers', 'bookings', 'help'].includes(seg[0]) ? { name:seg[0] }
      : { name:'page', param:seg[0] };
  }
  render();
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (document.getElementById('prevShell')) paintPreview(); });
route();
</script>
</body></html>
