<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B2Fleet — marketplace and content studio prototype</title>
<meta name="description" content="Clickable prototype of the B2Fleet B2B car rental marketplace and its admin content studio.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpath d=%27M22 19V81%27 stroke=%27%231F6BFF%27 stroke-width=%2718%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
/* ============ TOKENS ============ */
:root{
  --navy:#0B2545; --navy-2:#123A63; --blue:#1F6BFF; --blue-d:#1557D6;
  --ink:#0B2545; --muted:#5C7191; --line:#E2E9F2; --surface:#F4F7FC;
  --card:#FFFFFF; --amber-bg:#FFF7E6; --amber:#9A6A0B;
  --green-bg:#E9F7EF; --green:#12784A; --radius:12px;
  --shadow-sm:0 1px 2px rgba(11,37,69,.06),0 1px 3px rgba(11,37,69,.05);
  --shadow-md:0 4px 16px rgba(11,37,69,.08);
  --shadow-lg:0 18px 50px rgba(11,37,69,.16);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
img{display:block;max-width:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;font-weight:800;line-height:1.1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LOGO ============ */
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.03em}
.logo svg{flex:none}
.logo .b2{color:var(--blue)}
.logo .fl{color:var(--navy)}
.logo.on-dark .fl,.logo.on-dark .b2{color:#fff}
.logo.on-dark .b2{color:#7FB0FF}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;
  padding:10px 18px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:.15s}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn-dark{background:var(--navy);color:#fff}
.btn-outline-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn-outline-w:hover{background:rgba(255,255,255,.1)}
.btn-lg{padding:14px 24px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ============ PUBLIC HEADER ============ */
.site-head{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:40}
.site-head .wrap{display:flex;align-items:center;gap:26px;height:64px}
.site-nav{display:flex;gap:22px;font-weight:600;font-size:14.5px;color:var(--ink)}
.site-nav a:hover{color:var(--blue)}
.head-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
.pill-sel{display:flex;align-items:center;gap:5px;color:var(--muted)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* ============ HERO ============ */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.hero-img{position:absolute;inset:0}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(11,37,69,.96) 0%,rgba(11,37,69,.88) 34%,rgba(11,37,69,.30) 62%,rgba(11,37,69,.12) 100%)}
.hero-inner{position:relative;padding:62px 0 0}
.hero h1{font-size:clamp(32px,4.6vw,54px);line-height:1.06;white-space:pre-line;letter-spacing:-.035em}
.hero p.sub{margin:20px 0 0;max-width:360px;color:#C7D6EA;font-size:16px;line-height:1.55}

/* search panel */
.search-card{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);margin-top:38px;overflow:hidden;color:var(--ink)}
.search-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.search-tabs::-webkit-scrollbar{display:none}
.search-tab{flex:none;display:flex;align-items:center;gap:8px;padding:15px 22px;font-weight:600;font-size:14.5px;
  color:var(--muted);background:none;border:0;border-bottom:2px solid transparent}
.search-tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.search-body{display:grid;grid-template-columns:1.5fr 1fr 1fr auto 1fr auto;gap:0;align-items:stretch;padding:8px}
.sf{padding:9px 14px;border-right:1px solid var(--line);min-width:0}
.sf:last-of-type{border-right:0}
.sf label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.sf .val{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-check{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13.5px;font-weight:600;border-right:1px solid var(--line)}
.sf-check i{width:16px;height:16px;border:1.5px solid #B9C6D8;border-radius:4px;display:block;flex:none}
.search-go{margin:4px;align-self:stretch}

/* trust strip */
.trust{position:relative;display:flex;gap:38px;flex-wrap:wrap;padding:22px 0 30px;color:#D6E3F3;font-size:14px;font-weight:600}
.trust div{display:flex;align-items:center;gap:9px}

/* ============ SECTIONS ============ */
.sec{padding:44px 0}
.sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
.sec-head h2{font-size:clamp(21px,2.4vw,27px)}
.sec-head .more{margin-left:auto;color:var(--blue);font-weight:600;font-size:14.5px}
.bg-surface{background:var(--surface)}

/* destinations */
.dest-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);gap:14px;overflow-x:auto;
  padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.dest-row::-webkit-scrollbar{display:none}
.dest{scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow-sm);transition:.18s}
.dest:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ratio{position:relative;width:100%;overflow:hidden;background:#E8EEF6}
.ratio>img{position:absolute;inset:0;width:100%;height:100%}
.r-4x3{aspect-ratio:4/3}.r-16x10{aspect-ratio:16/10}.r-16x7{aspect-ratio:16/7}.r-1x1{aspect-ratio:1/1}.r-3x1{aspect-ratio:3/1}
.cover{object-fit:cover}
.contain{object-fit:contain}
.dest .meta{padding:11px 13px 13px}
.dest .meta b{display:block;font-size:15px;letter-spacing:-.01em}
.dest .meta span{font-size:12.5px;color:var(--muted)}

/* vehicles */
.veh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.veh{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.veh-top{position:relative;padding:10px 12px 0}
.veh-badges{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;z-index:2}
.chip{background:#EEF3FA;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700;color:var(--navy)}
.veh-spec{margin-left:auto;display:flex;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.veh-img{background:linear-gradient(180deg,#F2F7FD,#E8F0FA);border-radius:8px;padding:6px}
.veh-body{padding:12px;display:flex;flex-direction:column;gap:7px;flex:1}
.veh-body h3{font-size:16px}
.veh-body .trans{font-size:12.5px;color:var(--muted);margin-top:-4px}
.sup-line{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.sup-line .star{margin-left:auto;color:#E8A317;font-weight:700}
.tag-green{align-self:flex-start;background:var(--green-bg);color:var(--green);border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700}
.veh-price{border-top:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-end}
.veh-price small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.veh-price b{font-size:21px;letter-spacing:-.03em}
.veh-price .tot{text-align:right}
.veh-comm{background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:700;padding:8px 12px;display:flex;align-items:center;gap:7px;border-top:1px solid #F4E6C6}

/* platform panel */
.platform{background:linear-gradient(180deg,#E8F1FE,#DCEAFD);border-radius:16px;padding:34px;display:grid;grid-template-columns:.85fr 1.15fr;gap:28px;align-items:center}
.platform h2{font-size:clamp(22px,2.6vw,30px);line-height:1.15}
.plist{list-style:none;padding:0;margin:22px 0 26px;display:grid;gap:12px;font-weight:600;font-size:14.5px}
.plist li{display:flex;gap:10px;align-items:flex-start}
.mock{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;font-size:11px}
.mock-bar{background:var(--navy);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
.mock-body{display:grid;grid-template-columns:96px 1fr}
.mock-side{background:#F7FAFE;border-right:1px solid var(--line);padding:10px 8px;display:grid;gap:7px;color:var(--muted);font-weight:600}
.mock-side i{display:block;padding:4px 6px;border-radius:5px;font-style:normal}
.mock-side i.on{background:#E4EEFD;color:var(--blue)}
.mock-main{padding:11px}
.mock-tabs{display:flex;gap:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
.mock-tabs u{text-decoration:none;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:3px}
.mock-tr{display:grid;grid-template-columns:1fr 1fr 1fr .8fr;gap:6px;padding:6px 0;border-top:1px solid var(--line);color:var(--muted)}
.mock-tr b{color:var(--ink);font-weight:700}
.mock-tr em{font-style:normal;background:var(--green-bg);color:var(--green);border-radius:4px;padding:1px 6px;font-weight:700;justify-self:start}
.mock-voucher{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-md);padding:10px}

/* suppliers */
.sup-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.sup-box{border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:14px 12px;aspect-ratio:3/1}
.sup-box svg,.sup-box img{max-width:100%;max-height:100%;object-fit:contain}
.stats{display:flex;justify-content:space-around;gap:20px;margin-top:26px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:12px}
.stat b{display:block;font-size:23px;letter-spacing:-.03em}
.stat span{font-size:13px;color:var(--muted)}

/* cta band */
.cta-band{background:var(--navy);color:#fff}
.cta-band .wrap{display:flex;align-items:center;gap:24px;padding-top:36px;padding-bottom:36px;flex-wrap:wrap}
.cta-band h2{font-size:clamp(21px,2.4vw,27px)}
.cta-band p{margin:8px 0 0;color:#BCCEE4;font-size:14.5px;max-width:430px}
.cta-band .acts{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}

/* footer */
.site-foot{background:var(--navy);color:#B9CBE2;border-top:1px solid rgba(255,255,255,.09);font-size:13.5px}
.foot-top{display:grid;grid-template-columns:1.5fr repeat(5,1fr) auto;gap:26px;padding:38px 0 30px}
.foot-col h4{color:#fff;font-size:13px;letter-spacing:0;margin-bottom:12px;font-weight:700}
.foot-col a{display:block;padding:4px 0}
.foot-col a:hover{color:#fff}
.foot-blurb{max-width:210px;margin:14px 0 16px;line-height:1.55}
.socials{display:flex;gap:9px}
.socials i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-size:11px}
.foot-sel{border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:9px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;color:#fff;font-weight:600;font-size:13px}
.foot-bot{border-top:1px solid rgba(255,255,255,.1);padding:15px 0;display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px}
.foot-bot .r{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap}

/* draft ribbon */
.draft-ribbon{background:#FFF3D4;border-bottom:1px solid #F0DCA6;color:#8A5E00;font-weight:700;font-size:13px;
  padding:9px 20px;display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.draft-ribbon button{background:#8A5E00;color:#fff;border:0;border-radius:6px;padding:5px 12px;font-weight:700;font-size:12.5px}

/* floating studio link */
.to-studio{position:fixed;right:16px;bottom:16px;z-index:60;box-shadow:var(--shadow-lg)}

/* ============ RESPONSIVE PUBLIC ============ */
@media (max-width:1040px){
  .veh-grid{grid-template-columns:repeat(2,1fr)}
  .sup-strip{grid-template-columns:repeat(3,1fr)}
  .foot-top{grid-template-columns:1fr 1fr 1fr;gap:22px}
  .search-body{grid-template-columns:1fr 1fr}
  .sf,.sf-check{border-right:0;border-bottom:1px solid var(--line)}
  .search-go{grid-column:1/-1}
}
@media (max-width:760px){
  .site-nav,.head-right{display:none}
  .burger{display:block}
  .hero-inner{padding-top:34px}
  .hero-scrim{background:linear-gradient(170deg,rgba(11,37,69,.90) 0%,rgba(11,37,69,.80) 55%,rgba(11,37,69,.60) 100%)}
  .platform{grid-template-columns:1fr;padding:22px}
  .veh-grid{grid-template-columns:1fr}
  .sup-strip{grid-template-columns:repeat(2,1fr)}
  .foot-top{grid-template-columns:1fr 1fr}
  .search-body{grid-template-columns:1fr}
  .sec{padding:32px 0}
}
</style>
<style>
/* ============ STUDIO SHELL ============ */
.studio{display:grid;grid-template-columns:246px 1fr;min-height:100vh;background:var(--surface)}
.studio.collapsed{grid-template-columns:66px 1fr}
.s-side{background:var(--navy);color:#AFC4DE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.s-brand{padding:16px 16px 12px;display:flex;align-items:center;gap:10px}
.s-brand .tag{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:rgba(255,255,255,.14);
  color:#fff;padding:3px 6px;border-radius:4px}
.s-nav{flex:1;overflow-y:auto;padding:6px 10px 16px}
.s-nav h6{margin:16px 0 6px;padding:0 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5D7A9E;font-weight:800}
.s-nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;color:#C2D4EA;
  padding:9px 10px;border-radius:8px;font-weight:600;font-size:14px;text-align:left;white-space:nowrap}
.s-nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.s-nav button.on{background:var(--blue);color:#fff}
.s-nav button .ic{flex:none;width:18px;display:grid;place-items:center}
.s-nav button .soon{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#6E8CB2;border:1px solid #33507A;padding:1px 4px;border-radius:4px}
.studio.collapsed .s-nav button span.lbl,.studio.collapsed .s-nav h6,.studio.collapsed .s-brand .txt,.studio.collapsed .s-nav .soon{display:none}
.studio.collapsed .s-nav button{justify-content:center;padding:10px 0}
.s-foot{padding:12px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;font-size:12.5px}
.s-foot .who{min-width:0}
.s-foot .who b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}

.s-main{min-width:0;display:flex;flex-direction:column}
.s-top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.s-top h1{font-size:19px}
.s-top .crumb{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.s-top .acts{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.icon-btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:#C9D6E6}
.s-body{padding:22px;flex:1;min-width:0}
.save-dot{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.save-dot i{width:8px;height:8px;border-radius:50%;background:#C6D2E2;display:block}
.save-dot.dirty i{background:#E8A317}
.save-dot.saved i{background:#22A06B}

/* cards + grid */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-h h3{font-size:15.5px}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:1.6fr 1fr}

.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi b{display:block;font-size:29px;letter-spacing:-.035em;margin-top:6px}
.kpi em{font-style:normal;font-size:12px;color:var(--green);font-weight:700}

.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:9px;font-size:13.5px;line-height:1.45}
.alert b{display:block}
.a-warn{background:var(--amber-bg);color:var(--amber);border:1px solid #F2E2BE}
.a-info{background:#EDF3FE;color:#1B4F9E;border:1px solid #D3E2FB}
.a-note{background:#F6F8FC;color:var(--muted);border:1px solid var(--line)}

/* forms */
.field{margin-bottom:14px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:4px}
.inp,.sel,.ta{width:100%;border:1px solid #D6E0EC;border-radius:8px;padding:9px 11px;background:#fff;font-size:14px}
.ta{min-height:78px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(31,107,255,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.switch{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;cursor:pointer}
.switch input{display:none}
.switch i{width:38px;height:22px;border-radius:11px;background:#CDD9E7;position:relative;transition:.16s;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + i{background:var(--blue)}
.switch input:checked + i::after{transform:translateX(16px)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:800}
.tbl td{padding:10px 12px;border-bottom:1px solid #EEF2F8;vertical-align:middle}
.tbl tr:hover td{background:#FAFCFF}
.tbl .thumb{width:64px;height:40px;border-radius:6px;background:#EDF3FA;object-fit:contain;flex:none}
.tbl .nm{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .nm small{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-live{background:var(--green-bg);color:var(--green)}
.b-draft{background:#FFF3D4;color:#8A5E00}
.b-arch{background:#EEF2F7;color:var(--muted)}
.b-blue{background:#E7F0FF;color:var(--blue-d)}
.tbl-scroll{overflow-x:auto}

/* section list (homepage editor) */
.seclist{display:grid;gap:9px}
.secrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.secrow.dragging{opacity:.4}
.secrow.over{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,107,255,.12)}
.secrow .grip{cursor:grab;color:#A9B9CD;font-size:16px;line-height:1;touch-action:none}
.secrow .lbl{font-weight:700;font-size:14px}
.secrow .sub{font-size:12px;color:var(--muted)}
.secrow .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.ord{background:#fff;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.ord:hover{color:var(--blue);border-color:var(--blue)}

/* preview frame */
.prev-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#F8FAFD;flex-wrap:wrap}
.seg{display:flex;background:#E9EFF7;border-radius:8px;padding:3px}
.seg button{background:none;border:0;padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm)}
.prev-stage{background:#E7EDF5;padding:16px;overflow:auto;max-height:70vh}
.prev-shell{margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-md);transform-origin:top center}

/* media library */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:13px}
.mtile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;text-align:left;padding:0;position:relative}
.mtile.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,107,255,.16)}
.mtile .cap{padding:8px 9px;font-size:11.5px}
.mtile .cap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.mtile .cap span{color:var(--muted)}
.mtile .flag{position:absolute;top:7px;right:7px;background:var(--amber-bg);color:var(--amber);border-radius:20px;padding:2px 7px;font-size:10px;font-weight:800}
.dropzone{border:2px dashed #C3D3E6;border-radius:12px;padding:22px;text-align:center;color:var(--muted);background:#FAFCFF;font-size:13.5px}
.dropzone.hot{border-color:var(--blue);background:#F0F6FF;color:var(--blue)}

/* focal editor */
.focal{position:relative;border-radius:10px;overflow:hidden;background:#0B2545;touch-action:none;cursor:crosshair;user-select:none}
.focal img{width:100%;display:block;pointer-events:none}
.focal .dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(11,37,69,.5),0 3px 10px rgba(0,0,0,.4);pointer-events:none}
.focal .dot::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.focal .gridlines{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent 33.33%,rgba(255,255,255,.28) 33.33%,rgba(255,255,255,.28) calc(33.33% + 1px),transparent calc(33.33% + 1px),transparent 66.66%,rgba(255,255,255,.28) 66.66%,rgba(255,255,255,.28) calc(66.66% + 1px),transparent calc(66.66% + 1px)),
  linear-gradient(to bottom,transparent 33.33%,rgba(255,255,255,.28) 33.33%,rgba(255,255,255,.28) calc(33.33% + 1px),transparent calc(33.33% + 1px),transparent 66.66%,rgba(255,255,255,.28) 66.66%,rgba(255,255,255,.28) calc(66.66% + 1px),transparent calc(66.66% + 1px))}
.crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:11px}
.crop-lbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(11,37,69,.45);z-index:80;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:81;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer-h h3{font-size:16px}
.drawer-b{flex:1;overflow-y:auto;padding:18px}
.drawer-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;background:#FAFCFF}
.drawer-f .r{margin-left:auto;display:flex;gap:9px}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin:-4px -18px 16px;padding:0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 12px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

/* sign in */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 600px at 20% -10%,#164077 0%,transparent 60%),var(--navy)}
.signin-card{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:min(410px,100%);padding:28px}
.signin-card h2{font-size:22px;margin-bottom:5px}
.signin-card p.lead{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.role-pick{display:grid;gap:7px}
.role-pick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;font-size:13.5px}
.role-pick label.on{border-color:var(--blue);background:#F4F8FF}
.role-pick input{margin-top:2px}
.role-pick b{display:block}
.role-pick span{color:var(--muted);font-size:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-weight:600;font-size:13.5px;z-index:200;box-shadow:var(--shadow-lg);max-width:90vw}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:7px;font-size:16px}
.empty p{max-width:420px;margin:0 auto;font-size:13.5px;line-height:1.6}

@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g2,.g-2-1{grid-template-columns:1fr}
  .studio{grid-template-columns:1fr}
  .s-side{position:fixed;left:0;top:0;bottom:0;width:246px;z-index:90;transform:translateX(-100%);transition:.2s;height:100vh}
  .studio.open .s-side{transform:none}
  .studio.collapsed{grid-template-columns:1fr}
  .studio.collapsed .s-nav button span.lbl,.studio.collapsed .s-brand .txt{display:inline}
  .studio.collapsed .s-nav button{justify-content:flex-start;padding:9px 10px}
  .s-body{padding:14px}
  .s-top{padding:11px 14px}
  .row2,.row3{grid-template-columns:1fr}
}
</style>

   PUBLIC SITE — rendered from the content document, never hard-coded.
   The same function paints the live site and the studio preview.
   ======================================================================= */

const img = k => ASSETS[k] || '';
const fp = f => `object-position:${(f.x * 100).toFixed(1)}% ${(f.y * 100).toFixed(1)}%`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const eur = n => '€' + Number(n).toLocaleString('en-GB');
const supOf = (site, id) => site.suppliers.find(s => s.id === id) || { name:'—', rating:'—', colour:'#0B2545', tagline:'' };

function secHero(site) {
  const h = site.homepage.hero, n = site.nav;
  return `<section class="hero">
    <div class="hero-img"><img src="${img(h.image)}" alt="" style="${fp(h.focal)}"></div>
    <div class="hero-scrim"></div>
    <div class="hero-inner"><div class="wrap">
      <h1>${esc(h.headline)}</h1>
      <p class="sub">${esc(h.sub)}</p>
      <div class="search-card">
        <div class="search-tabs">${h.tabs.map((t, i) =>
          `<button class="search-tab${i === 0 ? ' on' : ''}" type="button">${I(t.icon, 17)}${esc(t.label)}</button>`).join('')}</div>
        <div class="search-body">
          <div class="sf"><label>Pick-up location</label><div class="val">${I('pin', 15)}${esc(h.location)}</div></div>
          <div class="sf"><label>Pick-up</label><div class="val">${I('cal', 15)}${esc(h.pickup)}</div></div>
          <div class="sf"><label>Drop-off</label><div class="val">${I('cal', 15)}${esc(h.dropoff)}</div></div>
          <div class="sf-check"><i></i>${esc(h.returnLabel)}</div>
          <div class="sf"><label>${esc(h.ageLabel)}</label><div class="val">${I('user', 15)}${esc(h.age)}</div></div>
          <button class="btn btn-pri btn-lg search-go" type="button">${esc(h.cta)}</button>
        </div>
      </div>
      ${(site.homepage.sections.find(x => x.id === 'trust') || {}).visible
        ? `<div class="trust">${site.homepage.trust.map(t =>
            `<div>${I(t.icon, 18)}${esc(t.label)}</div>`).join('')}</div>`
        : '<div style="height:26px"></div>'}
    </div></div>
  </section>`;
}

function secTrust() { return ''; } /* trust lives inside the hero band visually */

function secDestinations(site) {
  const live = site.destinations.filter(d => d.status === 'published');
  if (!live.length) return `<section class="sec"><div class="wrap"><div class="alert a-note">No published destinations yet.</div></div></section>`;
  return `<section class="sec"><div class="wrap">
    <div class="sec-head"><h2>${esc(site.homepage.destinationsTitle)}</h2></div>
    <div class="dest-row">${live.map(d => `
      <article class="dest">
        <div class="ratio r-4x3"><img class="cover" src="${img(d.image)}" alt="${esc(d.name)}" style="${fp(d.focal)}"></div>
        <div class="meta"><b>${esc(d.name)}</b><span>from ${eur(d.from)}/day</span></div>
      </article>`).join('')}</div>
  </div></section>`;
}

function secVehicles(site) {
  const list = site.vehicles.filter(v => v.status === 'published' && v.featured).slice(0, 4);
  const pool = list.length ? list : site.vehicles.filter(v => v.status === 'published').slice(0, 4);
  return `<section class="sec"><div class="wrap">
    <div class="sec-head"><h2>${esc(site.homepage.vehiclesTitle)}</h2>
      <span class="more">${esc(site.homepage.vehiclesMore)} ${I('right', 14)}</span></div>
    <div class="veh-grid">${pool.map(v => {
      const s = supOf(site, v.supplier);
      return `<article class="veh">
        <div class="veh-top">
          <div class="veh-badges"><span class="chip">${esc(v.category)}</span>
            <span class="veh-spec"><span>${I('seat', 13)} ${v.seats}</span><span>${I('bag', 13)} ${v.bags}</span></span></div>
          <div class="veh-img"><div class="ratio r-16x10"><img class="contain" src="${img(v.image)}" alt="${esc(v.name)} ${esc(v.orSimilar)}"></div></div>
        </div>
        <div class="veh-body">
          <h3>${esc(v.name)}</h3><div class="trans">${esc(v.transmission)}</div>
          <div class="sup-line">${I('shield', 15)}${esc(s.name)}<span class="star">${I('star', 13)} ${s.rating}</span></div>
          ${v.cancellation ? `<span class="tag-green">Free cancellation</span>` : ''}
        </div>
        <div class="veh-price">
          <div><small>Net B2B price</small><b>${eur(v.net)}</b><span style="font-size:12px;color:var(--muted)">/day</span></div>
          <div class="tot"><small>Total (7 days)</small><b>${eur(v.total)}</b></div>
        </div>
        <div class="veh-comm">${I('money', 14)} Earn ${eur(v.commission)} commission</div>
      </article>`;
    }).join('')}</div>
  </div></section>`;
}

function secPlatform(site) {
  const p = site.homepage.platform;
  const rows = [
    ['BF-92041','Sun & Sea Travel','12 Sep, 10:00','Economy','Confirmed'],
    ['BF-10940','Blue Horizon Tours','14 Sep, 09:00','SUV','Confirmed'],
    ['BF-92639','Global Business Travel','16 Sep, 13:30','Executive','On request'],
    ['BF-10638','Island Escapes','18 Sep, 08:00','Compact','Confirmed']
  ];
  return `<section class="sec"><div class="wrap"><div class="platform">
    <div>
      <h2 style="white-space:pre-line">${esc(p.title)}</h2>
      <ul class="plist">${p.bullets.map(b => `<li><span style="color:var(--blue)">${I('check', 19)}</span>${esc(b)}</li>`).join('')}</ul>
      <button class="btn btn-pri" type="button">${esc(p.cta)} ${I('right', 15)}</button>
    </div>
    <div class="mock" aria-hidden="true">
      <div class="mock-bar">${logoMark(15, 'white')} B2Fleet</div>
      <div class="mock-body">
        <div class="mock-side"><i>Dashboard</i><i class="on">Bookings</i><i>Vouchers</i><i>Reports</i><i>Suppliers</i><i>Settings</i></div>
        <div class="mock-main">
          <div class="mock-tabs"><u>Upcoming</u><span>Past</span><span>Cancelled</span></div>
          ${rows.map(r => `<div class="mock-tr"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span><em>${r[4]}</em></div>`).join('')}
          <div class="mock-voucher">
            <div style="display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:800">${I('img', 12)} Your logo</div>
            <div style="font-weight:800;margin:6px 0 2px">CAR RENTAL VOUCHER</div>
            <div style="color:var(--muted)">Booking BF-92041 · Athens Airport · 12/09/2026</div>
          </div>
        </div>
      </div>
    </div>
  </div></div></section>`;
}

function secSuppliers(site) {
  const live = site.suppliers.filter(s => s.status === 'active' && s.featured);
  return `<section class="sec"><div class="wrap">
    <div class="sec-head"><h2>${esc(site.homepage.suppliersTitle)}</h2></div>
    <div class="sup-strip">${live.map(s => `<div class="sup-box">${supplierLogo(s)}</div>`).join('')}</div>
    <div class="stats">${site.homepage.stats.map(s =>
      `<div class="stat"><span style="color:var(--muted)">${I(s.icon, 26)}</span><div><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div></div>`).join('')}</div>
  </div></section>`;
}

function secCta(site) {
  const c = site.homepage.cta;
  return `<section class="cta-band"><div class="wrap">
    <div><h2>${esc(c.title)}</h2><p>${esc(c.sub)}</p></div>
    <div class="acts">
      <button class="btn btn-pri btn-lg" type="button">${esc(c.primary)} ${I('right', 15)}</button>
      <button class="btn btn-outline-w btn-lg" type="button">${esc(c.secondary)} ${I('right', 15)}</button>
    </div>
  </div></section>`;
}

function publicHeader(site) {
  const n = site.nav;
  return `<header class="site-head"><div class="wrap">
    ${logoLockup(21)}
    <nav class="site-nav">${n.main.map(m => `<a href="#/">${esc(m.label)}</a>`).join('')}</nav>
    <div class="head-right">
      <span class="pill-sel">${esc(n.currency)} ${I('chev', 14)}</span>
      <span class="pill-sel">${I('globe', 15)} ${esc(n.language)} ${I('chev', 14)}</span>
      <button class="btn btn-ghost" type="button">${esc(n.ctaGhost)}</button>
      <button class="btn btn-dark" type="button">${esc(n.ctaSolid)}</button>
    </div>
    <button class="burger" type="button" aria-label="Menu">${I('menu', 20)}</button>
  </div></header>`;
}

function publicFooter(site) {
  const f = site.footer;
  return `<footer class="site-foot"><div class="wrap">
    <div class="foot-top">
      <div class="foot-col">${logoLockup(19, true)}
        <p class="foot-blurb">${esc(f.blurb)}</p>
        <div class="socials"><i>in</i><i>f</i><i>ig</i></div></div>
      ${f.columns.map(c => `<div class="foot-col"><h4>${esc(c.title)}</h4>${c.links.map(l => `<a href="#/">${esc(l)}</a>`).join('')}</div>`).join('')}
      <div class="foot-col">
        <div class="foot-sel">${I('globe', 15)} ${esc(site.nav.language)} ${I('chev', 14)}</div>
        <div class="foot-sel">${esc(site.nav.currency)} (€) ${I('chev', 14)}</div>
      </div>
    </div>
    <div class="foot-bot"><span>${esc(f.copyright)}</span>
      <span class="r">${f.legal.map(l => `<a href="#/">${esc(l)}</a>`).join('')}</span></div>
  </div></footer>`;
}

const SECTION_RENDER = {
  hero: secHero, trust: secTrust, destinations: secDestinations,
  vehicles: secVehicles, platform: secPlatform, suppliers: secSuppliers, cta: secCta
};

function renderPublic(site, { chrome = true } = {}) {
  const body = site.homepage.sections
    .filter(s => s.visible)
    .map(s => (SECTION_RENDER[s.id] || (() => ''))(site))
    .join('');
  return (chrome ? publicHeader(site) : '') + `<main>${body}</main>` + (chrome ? publicFooter(site) : '');
}

/* brand tokens are applied by writing CSS variables — one source of truth */
function applyBranding(b, root) {
  const el = root || document.documentElement;
  el.style.setProperty('--blue', b.primary);
  el.style.setProperty('--navy', b.navy);
  el.style.setProperty('--surface', b.surface);
  el.style.setProperty('--radius', b.radius + 'px');
  el.style.setProperty('--blue-d', shade(b.primary, -18));
}
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16), amt = Math.round(2.55 * pct);
  const r = Math.min(255, Math.max(0, (n >> 16) + amt)),
        g = Math.min(255, Math.max(0, ((n >> 8) & 255) + amt)),
        b = Math.min(255, Math.max(0, (n & 255) + amt));
  return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

<script>
/* =======================================================================
   ADMIN STUDIO — shell, auth, navigation, dashboard
   ======================================================================= */

const NAV = [
  { group:'Content', items:[
    { id:'dashboard',   label:'Dashboard',   icon:'grid' },
    { id:'homepage',    label:'Homepage',    icon:'home' },
    { id:'pages',       label:'Pages',       icon:'file' },
    { id:'navigation',  label:'Navigation',  icon:'list' },
    { id:'footer',      label:'Footer',      icon:'panel' }
  ]},
  { group:'Marketplace', items:[
    { id:'vehicles',    label:'Vehicles',    icon:'car' },
    { id:'categories',  label:'Vehicle categories', icon:'layers', soon:true },
    { id:'destinations',label:'Destinations',icon:'pin' },
    { id:'locations',   label:'Locations',   icon:'pin', soon:true },
    { id:'suppliers',   label:'Suppliers',   icon:'shield' },
    { id:'insurance',   label:'Insurance plans', icon:'shield', soon:true },
    { id:'extras',      label:'Extras',      icon:'box', soon:true },
    { id:'offers',      label:'Offers and promotions', icon:'tag', soon:true }
  ]},
  { group:'Operations', items:[
    { id:'bookings',    label:'Bookings',    icon:'ticket' },
    { id:'agencies',    label:'Customer agencies', icon:'users', soon:true },
    { id:'testimonials',label:'Testimonials',icon:'quote', soon:true }
  ]},
  { group:'Brand and media', items:[
    { id:'media',       label:'Media library', icon:'img' },
    { id:'branding',    label:'Branding',    icon:'palette' },
    { id:'seo',         label:'SEO',         icon:'search' }
  ]},
  { group:'System', items:[
    { id:'users',       label:'Users and permissions', icon:'users' },
    { id:'settings',    label:'Site settings', icon:'gear' }
  ]}
];

const PAGE_TITLE = {};
NAV.forEach(g => g.items.forEach(i => PAGE_TITLE[i.id] = { label:i.label, group:g.group, soon:i.soon }));

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600);
}

/* ---------- dirty / publish ---------- */
function touch(what) {
  S.dirty = true;
  if (what) S.changes.unshift({ who:S.auth.name, what, when:stamp() });
  S.changes = S.changes.slice(0, 12);
  const d = document.getElementById('saveDot');
  if (d) { d.className = 'save-dot dirty'; d.querySelector('span').textContent = 'Unpublished changes'; }
}
function stamp() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  return `${p(n.getDate())}/${p(n.getMonth() + 1)}/${n.getFullYear()}, ${p(n.getHours())}:${p(n.getMinutes())}`;
}
function publishAll() {
  if (!canEdit()) return toast('Read-only viewers cannot publish.');
  S.published = clone(S.draft);
  S.dirty = false;
  S.lastPublished = stamp();
  S.changes.unshift({ who:S.auth.name, what:'Published all changes', when:S.lastPublished });
  render();
  toast('Published. The public site is now live with your changes.');
}

/* ---------- sign in ---------- */
function signinView() {
  return `<div class="signin"><div class="signin-card">
    <div style="margin-bottom:18px">${logoLockup(22)}</div>
    <h2>Sign in to the studio</h2>
    <p class="lead">Prototype sign-in. Pick a role to see how permissions change what you can reach.</p>
    <div class="field"><label for="siEmail">Work email</label>
      <input class="inp" id="siEmail" type="email" value="amir@zenithadvisory.ae" autocomplete="username"></div>
    <div class="field"><label for="siPass">Password</label>
      <input class="inp" id="siPass" type="password" value="prototype" autocomplete="current-password"></div>
    <div class="field"><label>Sign in as</label>
      <div class="role-pick" id="rolePick">
        ${Object.entries(ROLES).map(([k, r], i) => `
          <label class="${i === 0 ? 'on' : ''}"><input type="radio" name="role" value="${k}" ${i === 0 ? 'checked' : ''}>
            <span><b>${r.label}</b><span>Can ${r.can}.</span></span></label>`).join('')}
      </div></div>
    <button class="btn btn-pri btn-lg" style="width:100%" id="doSignin" type="button">Sign in</button>
    <p style="font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.5">
      No real authentication is wired up. In the built product this screen talks to the auth provider and every
      permission below is enforced again on the server.</p>
    <p style="margin:12px 0 0"><a href="#/" style="color:var(--blue);font-weight:600;font-size:13.5px">← Back to the public site</a></p>
  </div></div>`;
}

/* ---------- studio chrome ---------- */
function studioView() {
  const meta = PAGE_TITLE[S.adminPage] || { label:'Dashboard', group:'Content' };
  const initials = S.auth.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return `<div class="studio${S.sideCollapsed ? ' collapsed' : ''}${S.sideOpen ? ' open' : ''}" id="studio">
    <aside class="s-side">
      <div class="s-brand">${logoMark(26, 'white')}<span class="txt" style="color:#fff;font-weight:800;letter-spacing:-.02em">B2Fleet</span>
        <span class="tag txt">Studio</span></div>
      <nav class="s-nav">
        ${NAV.map(g => {
          const items = g.items.filter(i => canSee(i.id));
          if (!items.length) return '';
          return `<h6>${g.group}</h6>` + items.map(i => `
            <button type="button" data-goto="${i.id}" class="${S.adminPage === i.id ? 'on' : ''}">
              <span class="ic">${I(i.icon, 17)}</span><span class="lbl">${i.label}</span>
              ${i.soon ? '<span class="soon">SOON</span>' : ''}</button>`).join('');
        }).join('')}
      </nav>
      <div class="s-foot"><span class="avatar">${initials}</span>
        <span class="who"><b>${esc(S.auth.name)}</b><span style="color:#8FA8C6">${ROLES[S.auth.role].label}</span></span>
        <button class="icon-btn" type="button" id="signout" title="Sign out"
          style="margin-left:auto;background:transparent;border-color:rgba(255,255,255,.2);color:#C2D4EA">${I('right', 15)}</button>
      </div>
    </aside>
    <div class="s-main">
      <header class="s-top">
        <button class="icon-btn" type="button" id="sideToggle" aria-label="Toggle navigation">${I('menu', 18)}</button>
        <div><div class="crumb">${esc(meta.group)}</div><h1>${esc(meta.label)}</h1></div>
        <div class="acts">
          <span class="save-dot ${S.dirty ? 'dirty' : 'saved'}" id="saveDot"><i></i><span>${
            S.dirty ? 'Unpublished changes' : 'Published ' + S.lastPublished}</span></span>
          <a class="btn btn-ghost" href="#/" target="_self">${I('eye', 15)} View site</a>
          <button class="btn btn-pri" type="button" id="publishBtn" ${canEdit() ? '' : 'disabled'}>Publish</button>
        </div>
      </header>
      <div class="s-body" id="adminBody">${adminPage()}</div>
    </div>
  </div>${S.sideOpen ? '<div class="scrim" id="sideScrim"></div>' : ''}`;
}

/* ---------- dashboard ---------- */
function dashboard() {
  const d = S.draft;
  const noAlt = d.media.filter(m => !m.alt);
  const lowRes = d.media.filter(m => m.w < 1000);
  const drafts = [...d.vehicles.filter(v => v.status === 'draft').map(v => ['Vehicle', v.name]),
                  ...d.destinations.filter(x => x.status === 'draft').map(x => ['Destination', x.name])];
  const hidden = d.homepage.sections.filter(s => !s.visible);
  const kpi = (icon, label, value, note) => `<div class="kpi"><span>${I(icon, 15)}${label}</span><b>${value}</b>${note ? `<em>${note}</em>` : ''}</div>`;

  return `
  ${S.dirty ? `<div class="alert a-warn" style="margin-bottom:16px">${I('warn', 18)}
    <div><b>You have unpublished changes</b>The public site is still showing the last published version. Use Publish when you are ready.</div></div>` : ''}
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('car', 'Published vehicles', d.vehicles.filter(v => v.status === 'published').length, `${d.vehicles.length} total`)}
    ${kpi('pin', 'Destinations', d.destinations.filter(x => x.status === 'published').length, `${d.destinations.filter(x => x.status === 'draft').length} in draft`)}
    ${kpi('shield', 'Active suppliers', d.suppliers.filter(s => s.status === 'active').length, '6 countries')}
    ${kpi('ticket', 'Bookings this month', S.bookings.length, eur(S.bookings.reduce((a, b) => a + b.commission, 0)) + ' commission')}
  </div>
  <div class="grid g-2-1">
    <div style="display:grid;gap:16px">
      <div class="panel"><div class="panel-h"><h3>Needs attention</h3></div><div class="panel-b" style="display:grid;gap:10px">
        ${noAlt.length ? `<div class="alert a-warn">${I('warn', 18)}<div><b>${noAlt.length} images have no alt text</b>
          Alt text is used by screen readers and search engines. <a href="#/admin/media" style="color:inherit;text-decoration:underline">Open the media library</a>.</div></div>` : ''}
        ${lowRes.length ? `<div class="alert a-warn">${I('warn', 18)}<div><b>${lowRes.length} images are below 1000px wide</b>
          These will look soft in the homepage hero. They are fine on cards.</div></div>` : ''}
        ${hidden.length ? `<div class="alert a-info">${I('eyeoff', 18)}<div><b>${hidden.length} homepage section${hidden.length > 1 ? 's are' : ' is'} hidden</b>
          ${hidden.map(h => esc(h.label)).join(', ')}.</div></div>` : ''}
        ${drafts.length ? `<div class="alert a-info">${I('file', 18)}<div><b>${drafts.length} items in draft</b>
          ${drafts.map(x => esc(x[0] + ': ' + x[1])).join(' · ')}</div></div>` : ''}
        ${!noAlt.length && !lowRes.length && !hidden.length && !drafts.length
          ? `<div class="alert a-note">${I('check', 18)}<div>Nothing needs your attention.</div></div>` : ''}
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Quick actions</h3></div><div class="panel-b"
        style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn btn-ghost" data-goto="homepage" type="button">${I('edit', 15)} Edit the homepage</button>
        <button class="btn btn-ghost" data-quick="newvehicle" type="button">${I('plus', 15)} Add a vehicle</button>
        <button class="btn btn-ghost" data-quick="newdest" type="button">${I('plus', 15)} Add a destination</button>
        <button class="btn btn-ghost" data-goto="media" type="button">${I('upload', 15)} Media library</button>
        <button class="btn btn-ghost" data-goto="branding" type="button">${I('palette', 15)} Branding</button>
      </div></div>
    </div>
    <div class="panel" style="align-self:start"><div class="panel-h"><h3>Recent changes</h3></div>
      <div class="panel-b" style="padding:6px 0">
        ${S.changes.map(c => `<div style="padding:10px 16px;border-bottom:1px solid #F0F4F9">
          <div style="font-size:13.5px;font-weight:600">${esc(c.what)}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(c.who)} · ${esc(c.when)}</div></div>`).join('')}
      </div></div>
  </div>`;
}

<script>
/* =======================================================================
   ADMIN STUDIO — content editors
   ======================================================================= */

const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setPath(o, p, v) {
  const k = p.split('.'), last = k.pop();
  k.reduce((a, x) => a[x], o)[last] = v;
}
const ro = () => canEdit() ? '' : 'disabled';

/* ---------------- HOMEPAGE ---------------- */
const SECTION_FIELDS = {
  hero: [
    ['Headline', 'homepage.hero.headline', 'ta', 'Line breaks are kept exactly as you type them.'],
    ['Supporting text', 'homepage.hero.sub', 'ta'],

const DEV_W = { desktop:1280, tablet:834, mobile:390 };
function paintPreview() {
  const shell = document.getElementById('prevShell');
  if (!shell) return;
  const w = DEV_W[S.device];
  const avail = shell.parentElement.clientWidth - 4;
  const scale = Math.min(1, avail / w);
  shell.style.width = w + 'px';
  shell.style.transform = `scale(${scale})`;
  shell.style.height = ''; 
  shell.innerHTML = renderPublic(S.draft);
  requestAnimationFrame(() => {
    shell.parentElement.style.height = (shell.scrollHeight * scale + 32) + 'px';
  });
}

/* ---------------- FOCAL POINT EDITOR ---------------- */
const RATIO = { '16:7':16 / 7, '4:3':4 / 3, '16:10':16 / 10, '1:1':1, '3:1':3 };
function focalEditor(imgPath, focalPath, ratios) {
  const key = getPath(S.draft, imgPath), f = getPath(S.draft, focalPath);
  return `<div class="grid" style="gap:14px">
    <div class="focal" data-focal="${focalPath}" data-img="${imgPath}">
      <img src="${img(key)}" alt="">
      <div class="gridlines"></div>
      <div class="dot" style="left:${f.x * 100}%;top:${f.y * 100}%"></div>
    </div>
    <div>
      <div class="crop-lbl"><span>Automatic crops</span><span id="focalRead">${f.x.toFixed(2)} / ${f.y.toFixed(2)}</span></div>
      <div class="crops" id="cropRow">
        ${ratios.map(r => `<div><div class="crop-lbl">${r}</div>
          <div class="ratio" style="aspect-ratio:${r.replace(':', '/')};border-radius:7px">
            <img class="cover" src="${img(key)}" alt="" style="${fp(f)}"></div></div>`).join('')}
      </div>
    </div>
  </div>`;
}

function wireFocal(scope) {
  (scope || document).querySelectorAll('.focal').forEach(el => {
    if (el.dataset.wired) return;
    el.dataset.wired = '1';
    const move = e => {
      if (!canEdit()) return;
      const r = el.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
      const f = getPath(S.draft, el.dataset.focal);
      f.x = x; f.y = y;
      el.querySelector('.dot').style.left = x * 100 + '%';
      el.querySelector('.dot').style.top = y * 100 + '%';
      const read = document.getElementById('focalRead');
      if (read) read.textContent = x.toFixed(2) + ' / ' + y.toFixed(2);
      el.closest('.panel-b, .drawer-b')?.querySelectorAll('.crops img, .crop-live')
        .forEach(im => im.style.objectPosition = `${x * 100}% ${y * 100}%`);
      touch(null);
      schedulePreview();
    };
    let down = false;
    el.addEventListener('pointerdown', e => { down = true; el.setPointerCapture(e.pointerId); move(e); });
    el.addEventListener('pointermove', e => { if (down) move(e); });
    el.addEventListener('pointerup', e => { down = false; touch('Adjusted an image focal point'); });
    el.addEventListener('pointercancel', () => down = false);
  });
}
let prevT;
function schedulePreview() { clearTimeout(prevT); prevT = setTimeout(paintPreview, 160); }

function addUpload(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const id = 'm-up-' + Date.now() + Math.random().toString(36).slice(2, 6);
      ASSETS[id] = rd.result;
      S.draft.media.unshift({ id, name:file.name, src:id, w:im.naturalWidth, h:im.naturalHeight,
        alt:'', focal:{ x:.5, y:.5 }, folder:'Uploads', usedIn:[] });
      S.mediaSel = id; S.mFolder = '';
      touch('Uploaded ' + file.name);
      render();
      toast(`Uploaded at ${im.naturalWidth} × ${im.naturalHeight}. Drag the marker to set the crop.`);
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

      <div class="drawer-h"><div><div class="crumb" style="font-size:12px;color:var(--muted);font-weight:600">${esc(o.sub || '')}</div>

        ${o.noSave ? '' : `<button class="btn btn-pri" type="button" data-save ${ro()}>Save</button>`}</div></div>
    </aside>`;
  wrap.id = 'drawerWrap';
  document.body.appendChild(wrap);
  wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeDrawer));
  wrap.querySelector('[data-save]')?.addEventListener('click', () => { o.onSave && o.onSave(); closeDrawer(); toast('Saved to draft. Publish when ready.'); });
  wrap.querySelectorAll('[data-tabs] button').forEach(b => b.addEventListener('click', () => {
    wrap.querySelectorAll('[data-tabs] button').forEach(x => x.classList.toggle('on', x === b));
    wrap.querySelectorAll('[data-pane]').forEach(p => p.classList.toggle('hide', p.dataset.pane !== b.dataset.tab));
  }));
  wireFocal(wrap);
}
function closeDrawer() { document.getElementById('drawerWrap')?.remove(); }

function render() {

  applyBranding(S.view === 'admin' ? S.draft.branding : S.published.branding);
  if (S.view === 'admin') {
    app.innerHTML = S.auth ? studioView() : signinView();
  } else {
    const site = S.previewDraft ? S.draft : S.published;
    app.innerHTML =
      (S.dirty && S.auth ? `<div class="draft-ribbon">${I('eye', 16)}
        <span>${S.previewDraft ? 'Previewing unpublished draft' : 'There are unpublished changes'}</span>
        <button type="button" id="togglePrev">${S.previewDraft ? 'Show published' : 'Preview draft'}</button></div>` : '') +
      renderPublic(site) +
      `<a class="btn btn-dark to-studio" href="#/admin">${I('gear', 16)} Studio</a>`;
  }
  wireFocal(document);
  if (document.getElementById('prevShell')) paintPreview();
  window.scrollTo(0, S.keepScroll || 0);
  S.keepScroll = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-goto],[data-quick],[data-move],[data-vis],[data-editsec],[data-veh],[data-vdup],[data-dest],[data-sup],[data-media],[data-book],[data-dev],[data-navmove],[data-navdel],#publishBtn,#sideToggle,#signout,#doSignin,#togglePrev,#mUploadBtn,#mReplace,#mHere,#navAdd,#sideScrim');
  if (!t) return;
  const d = t.dataset;

  if (t.id === 'doSignin') {
    const role = document.querySelector('input[name=role]:checked').value;
    S.auth = { name: role === 'editor' ? 'Sharol Pinto' : 'Amir', role };
    if (!canSee(S.adminPage)) S.adminPage = 'dashboard';
    render(); toast('Signed in as ' + ROLES[role].label + '.'); return;
  }
  if (t.id === 'signout') { S.auth = null; render(); return; }
  if (t.id === 'publishBtn') return publishAll();
  if (t.id === 'sideToggle') {
    if (window.innerWidth <= 900) S.sideOpen = !S.sideOpen; else S.sideCollapsed = !S.sideCollapsed;
    render(); return;
  }
  if (t.id === 'sideScrim') { S.sideOpen = false; render(); return; }
  if (t.id === 'togglePrev') { S.previewDraft = !S.previewDraft; render(); return; }
  if (t.id === 'mUploadBtn') return document.getElementById('mFile').click();
  if (t.id === 'mReplace' || t.id === 'mHere') return toast(t.id === 'mReplace'
    ? 'Would replace this file in every place it is used.' : 'Would replace this file here only.');
  if (t.id === 'navAdd') { S.draft.nav.main.push({ label:'New link', href:'#/' }); touch('Added a navigation link'); render(); return; }

  if (d.goto) { S.adminPage = d.goto; S.sideOpen = false; if (S.view !== 'admin') location.hash = '#/admin'; else render(); return; }
  if (d.dev) { S.device = d.dev; render(); return; }

  if (d.move) {
    const [i, dir] = d.move.split(':').map(Number), a = S.draft.homepage.sections;
    [a[i], a[i + dir]] = [a[i + dir], a[i]];
    touch('Reordered homepage sections'); render(); return;
  }
  if (d.vis !== undefined && d.vis !== '') {
    const s = S.draft.homepage.sections[Number(d.vis)];
    s.visible = !s.visible; touch((s.visible ? 'Showed' : 'Hid') + ' homepage section — ' + s.label); render(); return;
  }
  if (d.editsec) {
    const id = d.editsec;
    openDrawer(SECTION_FIELDS[id].map(f => fieldHtml(f[0], f[1], f[2], f[3])).join(''),
      { title: S.draft.homepage.sections.find(s => s.id === id).label, sub:'Homepage section',
        onSave: () => { touch('Edited homepage section'); render(); } });
    return;
  }
  if (d.navmove) {
    const [i, dir] = d.navmove.split(':').map(Number), a = S.draft.nav.main;
    [a[i], a[i + dir]] = [a[i + dir], a[i]]; touch('Reordered navigation'); render(); return;
  }
  if (d.navdel) { S.draft.nav.main.splice(Number(d.navdel), 1); touch('Removed a navigation link'); render(); return; }

  if (d.veh) return vehicleDrawer(d.veh);
  if (d.vdup) {
    const v = clone(S.draft.vehicles.find(x => x.id === d.vdup));
    v.id = 'v' + Date.now(); v.name += ' (copy)'; v.status = 'draft'; v.featured = false;
    S.draft.vehicles.unshift(v); touch('Duplicated vehicle'); render(); toast('Duplicated as a draft.'); return;
  }
  if (d.dest) return destDrawer(d.dest);
  if (d.sup) return supDrawer(d.sup);
  if (d.book) return bookingDrawer(d.book);
  if (d.media) { S.mediaSel = d.media; S.keepScroll = window.scrollY; render(); return; }

  if (d.quick === 'newvehicle') {
    const v = veh({ id:'v' + Date.now(), name:'New vehicle', brand:'', model:'', category:'Economy',
      seats:5, bags:1, transmission:'Manual', supplier:'medrent', destination:'athens', net:20, status:'draft' });
    S.draft.vehicles.unshift(v); S.adminPage = 'vehicles'; touch('Created a vehicle'); render(); vehicleDrawer(v.id); return;
  }
  if (d.quick === 'newdest') {
    const x = { id:'d' + Date.now(), name:'New destination', country:'', type:'City', slug:'new-destination',
      from:20, image:'athens', focal:{ x:.5, y:.5 }, blurb:'', featured:false, status:'draft', vehicles:0,
      seoTitle:'', seoDesc:'' };
    S.draft.destinations.push(x); S.adminPage = 'destinations'; touch('Created a destination'); render(); destDrawer(x.id); return;
  }
});

/* live-bound inputs */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) { setPath(S.draft, el.dataset.bind, el.value); touch(null); schedulePreview(); }
  if (el.dataset.brand) {
    S.draft.branding[el.dataset.brand] = el.value;
    document.querySelectorAll(`[data-brand="${el.dataset.brand}"]`).forEach(o => { if (o !== el) o.value = el.value; });
    applyBranding(S.draft.branding); touch(null); schedulePreview();
  }
  if (el.dataset.nav !== undefined && el.dataset.nav !== '') { S.draft.nav.main[Number(el.dataset.nav)].label = el.value; touch(null); }
  if (el.id === 'bRad') { S.draft.branding.radius = Number(el.value); document.getElementById('radVal').textContent = el.value + 'px'; applyBranding(S.draft.branding); touch(null); }
  if (el.id === 'mAlt') { const m = S.draft.media.find(x => x.id === (S.mediaSel || S.draft.media[0].id)); m.alt = el.value; touch(null); }
  if (el.id === 'vSearch') { S.vq = el.value; const b = document.getElementById('adminBody'); b.innerHTML = pageVehicles(); document.getElementById('vSearch').focus(); document.getElementById('vSearch').setSelectionRange(99, 99); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'vCat') { S.vcat = el.value; render(); }
  if (el.id === 'mFolder') { S.mFolder = el.value; render(); }
  if (el.id === 'mFile') { [...el.files].forEach(addUpload); }
  if (el.name === 'role') document.querySelectorAll('.role-pick label').forEach(l => l.classList.toggle('on', l.contains(el)));
});

/* drag to reorder homepage sections */
let dragI = null;
document.addEventListener('dragstart', e => {
  const r = e.target.closest('.secrow'); if (!r || !r.dataset.idx) return;
  dragI = Number(r.dataset.idx); r.classList.add('dragging');
});
document.addEventListener('dragover', e => {
  const r = e.target.closest('.secrow'); if (!r || dragI === null) return;
  e.preventDefault(); r.classList.add('over');
});
document.addEventListener('dragleave', e => e.target.closest('.secrow')?.classList.remove('over'));
document.addEventListener('drop', e => {
  const r = e.target.closest('.secrow'); if (!r || dragI === null) return;
  e.preventDefault();
  const to = Number(r.dataset.idx), a = S.draft.homepage.sections;
  a.splice(to, 0, a.splice(dragI, 1)[0]); dragI = null;
  touch('Reordered homepage sections'); render();
});
document.addEventListener('dragend', () => { dragI = null; document.querySelectorAll('.secrow').forEach(r => r.classList.remove('dragging', 'over')); });

/* drop files onto the media library */
['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest('#dropzone'); if (!z) return;
  e.preventDefault();
  if (ev === 'dragover') z.classList.add('hot');
  else { z.classList.remove('hot'); [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')).forEach(addUpload); }
}));

/* routing */
function route() {
  const h = location.hash || '#/';
  if (h.startsWith('#/admin')) {
    S.view = 'admin';
    const p = h.split('/')[2];
    if (p && PAGE_TITLE[p]) S.adminPage = p;
  } else S.view = 'public';
  render();
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (document.getElementById('prevShell')) paintPreview(); });
route();
</script>
</body></html>
